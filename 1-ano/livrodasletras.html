<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livro das Letras | Aprende &amp; Brinca</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.livro {
    position: relative;
    width: 800px;
    padding: 40px;
    margin-top: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}
.icone-livro {
    position: absolute;
    top: 50px;
    left: 20px;
    width: 200px;
    height: auto;
    z-index: 100;
}
.topo-titulo {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 20px; 
    color: #000000;
    z-index: 100;
    position: relative;
}
.topo-letra {
    text-align: center;
    margin-bottom: 50px; 
    font-weight: bold;
    color: #1e90ff;
}
.topo-instrucoes {
    text-align: center;
    font-size: 32px;
    margin-bottom: 15px;
    color: #000;
    font-weight: bold;
}
.pagina {
    display: none;
    flex-direction: column;
    padding: 40px;
    border-radius: 15px;
    transition: opacity 0.5s ease;
    opacity: 0;
    position: relative;
    z-index: 1;
}
.ativa { display: flex; opacity: 1; }
.linha {
    display: flex;
    align-items: center;
    margin: 25px 0;
    gap: 15px;
}
img.pictograma {
    width: 80px;
    height: 80px;
    object-fit: contain;
    border-radius: 10px;
    background: #fff;
}
.palavra {
    font-size: 36px;
    cursor: pointer;
    min-width: 200px;
    font-weight: bold;
}
input {
    flex: 1;
    font-size: 28px;
    padding: 8px;
    border: 3px solid #ccc;
    border-radius: 6px;
}
.certo { border-color: green; background: #e6ffe6; }
.errado { border-color: red; background: #ffe6e6; }
.menu {
    text-align: center;
    margin-top: 20px;
}
button {
    font-size: 20px;
    padding: 10px 30px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
.button-anterior { background-color: #ff7f50; }
.button-seguinte { background-color: #3cb44b; }
.pagina-num { text-align: center; font-size: 24px; margin-top: 10px; font-weight: bold; }
.contador { text-align: center; font-size: 24px; margin-top: 10px; font-weight: bold; color: #333; }
.mensagem {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #4CAF50;
    color: white;
    font-size: 40px;
    padding: 30px 50px;
    border-radius: 15px;
    display: none;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    z-index: 200;
}
.developers {
    text-align: center;
    font-size: 20px;
    margin-top: 30px;
    color: #555;
    font-weight: bold;
}

/* Apenas navegação do portal; o estilo original do livro é preservado. */
.portal-links{align-self:stretch;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:13px 10px;background:#073b78;font-family:Arial,sans-serif}
.portal-links a{color:#073b78;background:#fff;border-radius:999px;padding:11px 18px;text-decoration:none;font-weight:700;font-size:16px}
.portal-links a:hover,.portal-links a:focus-visible{background:#ffda55}
@media(max-width:940px){.livro{box-sizing:border-box;max-width:calc(100vw - 24px);width:800px;padding:20px}.pagina{padding:18px}.linha{flex-wrap:wrap}.icone-livro{max-width:22%;height:auto}.palavra{min-width:130px}}

/* Integração visual com o portal Aprende & Brinca. A lógica do livro mantém-se. */
:root{--navy:#073b78;--blue:#1597ed;--yellow:#ffd33d;--text:#17345b}
body{font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(180deg,#eaf9ff,#f8fbff 65%,#eef8f0);color:var(--text);min-height:100vh}
.portal-header{width:100%;background:var(--navy);color:#fff}
.portal-header-inner{width:min(1240px,94%);min-height:76px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.portal-brand{display:flex;align-items:center;gap:12px;font-weight:1000;font-size:1.5rem;color:#fff;text-decoration:none}
.portal-owl{width:52px;height:52px;border-radius:50%;background:#ffcc35;display:grid;place-items:center;font-size:2rem;border:4px solid #fff;box-shadow:0 4px 0 #042e61}
.portal-header-nav{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.portal-header-nav a{background:#fff;color:var(--navy);border-radius:15px;padding:11px 16px;text-decoration:none;font-size:16px;font-weight:900}
.portal-header-nav a:hover{background:var(--yellow)}
.book-heading{text-align:center;padding:26px 15px 2px}
.book-heading h1{font-size:clamp(2rem,5vw,3.3rem);color:var(--navy);margin:0 0 7px}
.book-heading p{font-size:1.1rem;color:#57708e;font-weight:800;margin:0}
.livro{box-sizing:border-box;width:min(900px,94%);padding:28px;margin:25px auto 0;border:2px solid #e3edf6;border-radius:28px;background:#fff;box-shadow:0 9px 0 #dce8f1}
.topo-titulo{font-size:1.45rem;color:var(--navy);padding:8px 10px 14px;margin:0}
.icone-livro{position:static;display:block;width:auto;height:auto;font-size:3.6rem;text-align:center;margin:0 auto 8px}
.pagina{padding:26px;border-radius:22px}
.topo-letra{margin-bottom:22px;color:var(--blue)}
.topo-instrucoes{font-size:clamp(1.4rem,3vw,2rem);color:var(--navy)}
.linha{padding:12px 15px;margin:12px 0;border-radius:17px;background:#ffffffb5;flex-wrap:wrap}
.palavra{font-size:clamp(1.6rem,3vw,2.1rem)}
input{min-width:160px;max-width:100%;font-family:inherit;border-radius:13px;border:3px solid #b6cce2;background:#fff}
input:focus{outline:3px solid #ffd33d;outline-offset:1px}
.menu{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0 34px}
.menu button{border-radius:16px;font-weight:900;box-shadow:0 5px 0 #0002;padding:13px 25px}
.button-anterior{background:#f48b19}.button-seguinte{background:#32bd5d}
.pagina-num,.contador{color:var(--navy)}
.mensagem{border-radius:24px;max-width:90vw;text-align:center}
@media(max-width:600px){.portal-header-inner{justify-content:center;padding:10px 0}.portal-brand{font-size:1.25rem}.portal-owl{width:44px;height:44px;font-size:1.6rem}.portal-header-nav{justify-content:center}.livro{padding:12px}.pagina{padding:14px}.linha{gap:10px;padding:10px}.linha input{flex-basis:100%;width:100%;font-size:23px}.palavra{min-width:0}.topo-letra{margin-bottom:14px}.topo-titulo{font-size:1.2rem}}
</style>
</head>
<body>
<header class="portal-header"><div class="portal-header-inner"><a class="portal-brand" href="../index.html"><span class="portal-owl">🦉</span><span>Aprende <span style="color:#ffd33d">&amp;</span> Brinca</span></a><nav class="portal-header-nav" aria-label="Navegação"><a href="index.html">⬅ Voltar ao 1.º Ano</a><a href="../index.html">🏠 Página inicial</a></nav></div></header>
<section class="book-heading"><h1>📖 Livro das Letras</h1><p>Aprende a ler, ouve e escreve palavras!</p></section>

<div class="livro">
<div class="icone-livro" aria-hidden="true">📚</div>
<div class="topo-titulo">Descobre as letras e as palavras!</div>
</div>

<div class="menu">
    <button class="button-anterior" onclick="mudar(-1)">← Anterior</button>
    <button class="button-seguinte" onclick="mudar(1)">Seguinte →</button>
</div>

<div id="mensagem" class="mensagem">🎉 Parabéns! 🎉</div>

<script>
// Letras normais + casos especiais
const ordemPaginas = ['P / p','T / t','L / l','D / d','M / m','V / v','C / c','N / n','R / r','B / b','G / g','S / s','J / j','F / f','Z / z','H / h','A / a','E / e','I / i','O / o','U / u','K / k','Q / q','W / w','X / x','Y / y',
'rr','r','ar/er/ir/or/ur','ss','ch','nh','lh','ce/ci','an/en/in/on/un','al/el/il/ol/ul','vr/dr/fr/gr/pr','am/em/im/om/um','ça/ço/çu','az/ez/iz/uz','bl/gl/fl/pl/cl','ge/gi','gue/gui','em/im/om/um','x'];

// Palavras do livro
const livroPalavras = {
'P / p': ['pato','pipa','Pepe','pote','palito','papa'],
'T / t': ['teia','tapete','tio','totó','Tito','apita'],
'L / l': ['lata','loto','lupa','Lili','lua','lula'],
'D / d': ['dedo','dado','data','Didi','dia','dália'],
'M / m': ['mota','mala','Mimi','mãe','meia','mata'],
'V / v': ['viola','vela','ovo','Violeta','Vilela','luva'],
'C / c': ['cama','copo','cão','cola','capa','cuco'],
'N / n': ['nota','novelo','neve','Nini','navio','nata'],
'R / r': ['rato','roda','rua','remo','ramo','rola'],
'B / b': ['bola','bolo','bata','bebé','Bela','bule'],
'G / g': ['gato','gola','cogumelo','galo','Gugu','papagaio'],
'S / s': ['sapo','sapato','sola','sol','sino','sopa'],
'J / j': ['janela','judo','tijolo','jipe','laje','Jaime'],
'F / f': ['foca','faca','Fátima','figo','fumo','fatia'],
'Z / z': ['zínia','gazela','azulejo','azul','baliza','búzio'],
'H / h': ['hiena','holofote','Helena','hipopótamo','hábito','humano'],
'A / a': ['avião','abelha','amigo','amor','alface','anel'],
'E / e': ['elefante','escola','estrela','energia','escova','enfeite'],
'I / i': ['ilha','igreja','índio','iogurte','isqueiro','inverno'],
'O / o': ['ovo','osso','olá','óculos','orvalho','onda'],
'U / u': ['urso','uva','universo','util','unha','uniforme'],
'K / k': ['kiwi','kilo','Kyara','kit','kilt','karting'],
'Q / q': ['queijo','quarto','quilo','queque','querida','quero'],
'W / w': ['Wilson','web','wifi','windsurf','whisky','web cam'],
'X / x': ['xixi','táxi','eixo','exame','xerife','Xana'],
'Y / y': ['yak','yoga','yin','yoyo','Yara','Yuki'],
'rr': ['burro','ferro','jarra','garrafa','carro','serra'],
'r': ['lírio','tubarão','peru','pera','pirata','marujo','muro'],
'ar/er/ir/or/ur': ['cadeira','gorila','porco','Maria','urso','erva'],
'ss': ['passa','massa','pessoa','festa','essa','bossa'],
'ch': ['chave','chocolate','chuva','chapéu','chefe','choque'],
'nh': ['ninho','manhã','banho','coelho','senhor','manha'],
'lh': ['galho','olho','milho','trabalho','colher','filho'],
'ce/ci': ['cinema','cenoura','cena','cicatriz','celular','ciclope'],
'an/en/in/on/un': ['banana','trem','dinheiro','longo','funil','pneu'],
'al/el/il/ol/ul': ['palha','mel','milho','sol','lula','balde'],
'vr/dr/fr/gr/pr': ['verde','dreno','fruta','grande','prato','preto'],
'am/em/im/om/um': ['amigo','elemento','imã','olmo','lume','rumo'],
'ça/ço/çu': ['coração','canção','laço','laço','lanço','chuva'],
'az/ez/iz/uz': ['lazanha','fez','pizza','luz','fuzil','jazz'],
'bl/gl/fl/pl/cl': ['blusa','globo','flor','plano','clube','clara'],
'ge/gi': ['gelo','girar','gesto','gira','gemido','gilete'],
'gue/gui': ['guerra','guia','guelra','guino','guelra','guizo'],
'em/im/om/um': ['em','im','om','um','sem','fim'],
'x': ['xale','xícara','xarope','xuxa','tórax','fixo']
};

const fundos = ['#ffe6e6','#e6f2ff','#e6ffe6','#fff0e6','#f2e6ff','#ffffe6','#e6ffff','#ffe6f2','#f9f9f9','#f0fff0','#f0f0ff','#fff0f0','#e6e6f9','#f9ffe6','#fff0cc','#ccffe6','#ffe6cc','#e6ccff','#fce6ff','#ccfff9','#f2f0e6','#e6f9ff','#ffe6f0','#f0ffe6','#fff6e6','#f0f6ff'];

const paginas = [];

function criarPagina(letraTopo, palavras, corFundo, numeroPagina){
    let pagina = document.createElement('div');
    pagina.classList.add('pagina');
    pagina.style.background = corFundo;

    let topo = document.createElement('div');
    topo.classList.add('topo-letra');

    const casosEspeciais = ['rr','r','ar/er/ir/or/ur','ss','ch','nh','lh','ce/ci','an/en/in/on/un','al/el/il/ol/ul','vr/dr/fr/gr/pr','am/em/im/om/um','ça/ço/çu','az/ez/iz/uz','bl/gl/fl/pl/cl','ge/gi','gue/gui','em/im/om/um','x'];

    if(casosEspeciais.includes(letraTopo)){
        topo.textContent = 'Caso de leitura: ' + letraTopo;
        if(topo.textContent.length > 20){ 
            topo.style.fontSize = '28px';
        } else if(topo.textContent.length > 15){
            topo.style.fontSize = '32px';
        } else {
            topo.style.fontSize = '40px';
        }
    } else {
        topo.textContent = letraTopo;
        topo.style.fontSize = '70px';
    }

    pagina.appendChild(topo);

    let instr = document.createElement('div');
    instr.classList.add('topo-instrucoes');
    instr.textContent = 'Copia as palavras:';
    pagina.appendChild(instr);

    palavras.forEach((palavra,i) => {
        let linha = document.createElement('div');
        linha.classList.add('linha');

        let img = document.createElement('img');
        img.className = 'pictograma';
        img.src = 'imagens/' + palavra + '.png';
        linha.appendChild(img);

        let divPal = document.createElement('div');
        divPal.classList.add('palavra');
        divPal.style.color = ['#e6194b','#3cb44b','#000000','#4363d8','#f58231','#911eb4'][i%6];
        divPal.textContent = palavra + ' 🔊';
        divPal.onclick = () => falar(palavra);
        linha.appendChild(divPal);

        let input = document.createElement('input');
        input.setAttribute('data-resposta', palavra);
        linha.appendChild(input);

        pagina.appendChild(linha);
    });

    let contador = document.createElement('div');
    contador.classList.add('contador');
    contador.textContent = `Palavras corretas: 0 / ${palavras.length}`;
    pagina.appendChild(contador);

    let numPag = document.createElement('div');
    numPag.classList.add('pagina-num');
    numPag.textContent = 'Página ' + numeroPagina + ' de ' + ordemPaginas.length;
    pagina.appendChild(numPag);

    document.querySelector('.livro').appendChild(pagina);
    paginas.push(pagina);
}

let idx = 0;
ordemPaginas.forEach((letra,i) => {
    criarPagina(letra, livroPalavras[letra], fundos[idx%fundos.length], i+1);
    idx++;
});

paginas[0].classList.add('ativa');

let atual = 0;
function mostrar(){ paginas.forEach((p,i)=>{ if(i===atual){ p.classList.add('ativa'); } else { p.classList.remove('ativa'); } }); }
function mudar(d){
    let proximo = atual + d;
    if(proximo<0) proximo=0;
    if(proximo>=paginas.length) proximo=paginas.length-1;
    if(proximo!==atual){
        paginas[atual].classList.remove('ativa');
        atual=proximo;
        paginas[atual].classList.add('ativa');
    }
}
function falar(texto){ const fala = new SpeechSynthesisUtterance(texto); fala.lang='pt-PT'; speechSynthesis.speak(fala); }

document.addEventListener('input', e => {
    if(e.target.tagName !== 'INPUT') return;
    const input = e.target;
    const resposta = input.dataset.resposta;
    const texto = input.value.trim();
    input.classList.remove('certo','errado');
    if(texto.length===0) return;
    if(texto===resposta) input.classList.add('certo'); else input.classList.add('errado');
    atualizarContador();
    verificarPagina();
});

function atualizarContador(){
    const inputs = paginas[atual].querySelectorAll('input');
    let contador = paginas[atual].querySelector('.contador');
    let corretas = Array.from(inputs).filter(i => i.classList.contains('certo')).length;
    contador.textContent = `Palavras corretas: ${corretas} / ${inputs.length}`;
}

function verificarPagina(){
    const inputs = paginas[atual].querySelectorAll('input');
    let tudoCerto = Array.from(inputs).every(i => i.classList.contains('certo'));
    if(tudoCerto) mostrarParabens();
}

function mostrarParabens(){
    const msg = document.getElementById('mensagem');
    msg.style.display='block';
    setTimeout(()=>{ msg.style.display='none'; mudar(1); },2000);
}
</script>

</body>
</html>
