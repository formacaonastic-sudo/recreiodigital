<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pensa Rápido! | Recreio Digital</title>
<style>
:root{--navy:#073b78;--blue:#1597ed;--yellow:#ffd33d;--ink:#17345b;--orange:#ff911b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#c6f0ff,#f5faff 55%,#ecf9ee);font-family:'Trebuchet MS',Arial,sans-serif;color:var(--ink);min-height:100vh;text-align:center}
a{text-decoration:none;color:inherit}.topbar{background:var(--navy);color:#fff;padding:11px max(15px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:1.3rem;font-weight:1000;display:flex;align-items:center;gap:9px}.owl{background:var(--yellow);border:3px solid #fff;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:1.6rem}.navlinks{display:flex;flex-wrap:wrap;gap:8px}.navlinks a{background:#ffffff20;border:1px solid #ffffff55;border-radius:13px;padding:10px 13px;font-weight:900}.navlinks a:hover{background:#1597ed}
main{max-width:1040px;margin:25px auto;padding:0 15px}.intro{background:#fff;border-radius:30px;padding:23px 20px;box-shadow:0 8px 0 #c9e7f0}.intro h1{font-size:clamp(2.3rem,6vw,4.2rem);margin:0;color:var(--navy);line-height:1.1}.intro p{margin:10px 0 0;color:#53718c;font-weight:800;font-size:1.1rem}.bolt{display:inline-block;animation:bounce 1.6s ease-in-out infinite}@keyframes bounce{50%{transform:scale(1.2) rotate(-12deg)}}
#menu{padding:20px 0}.lead{font-size:1.35rem;font-weight:900;color:var(--navy)}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:820px;margin:22px auto}.level-btn{font:900 1.35rem 'Trebuchet MS',Arial,sans-serif;border:0;border-radius:22px;min-height:112px;padding:20px;cursor:pointer;color:#fff;box-shadow:0 7px 0 #0002;transition:transform .15s}.level-btn:hover{transform:translateY(-4px)}.level-btn:nth-child(1){background:#25af69}.level-btn:nth-child(2){background:#168fe9}.level-btn:nth-child(3){background:#9459df}.level-btn:nth-child(4){background:#f08a18}.level-btn small{display:block;font-size:.9rem;margin-top:8px;opacity:.95}.mascot{display:block;width:min(120px,65vw);height:auto;margin:10px auto;animation:bounce 2.5s ease-in-out infinite}
#panel{display:none;justify-content:center;gap:13px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border-radius:17px;padding:13px 17px;font-weight:900;font-size:1.15rem;box-shadow:0 5px 0 #d9e8f2}#game{display:none;background:#fff;border:3px solid #e2f1fa;border-radius:30px;padding:30px 18px;margin:12px auto;max-width:820px;min-height:340px;box-shadow:0 9px 0 #d6e8f2;position:relative;overflow:hidden}.question{font-size:clamp(3rem,9vw,6rem);font-weight:1000;color:var(--navy);margin:20px 0}.answer-row{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}input{font:900 2rem 'Trebuchet MS',Arial,sans-serif;text-align:center;width:160px;max-width:100%;padding:10px;border:3px solid #b9d6ec;border-radius:15px;color:var(--navy)}button.action{font:900 1.15rem 'Trebuchet MS',Arial,sans-serif;background:var(--orange);color:white;border:0;border-radius:15px;padding:16px 25px;cursor:pointer;box-shadow:0 5px 0 #d67113}button.action:hover{filter:brightness(1.05)}button.action.secondary{background:#168fe9;box-shadow:0 5px 0 #0870bc}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}#feedback{font-size:1.4rem;min-height:35px;font-weight:900;color:#13744c}#character{font-size:3rem}#medal{font-size:3.6rem}.star{position:absolute;font-size:2rem;pointer-events:none;animation:floatUp 1s ease-out forwards}@keyframes floatUp{to{opacity:0;transform:translateY(-110px) scale(1.4)}}footer{padding:22px;color:#53718c;font-size:.92rem;font-weight:700}
@media(max-width:580px){.topbar{justify-content:center}.levels{grid-template-columns:1fr}.level-btn{min-height:86px}#game{padding:24px 12px}.stat{font-size:.95rem;padding:10px 12px}}
@media(prefers-reduced-motion:reduce){.bolt,.mascot,.star{animation:none}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="owl">🦉</span> Recreio Digital</a><nav class="navlinks" aria-label="Navegação"><a id="backYear" href="../1-ano/index.html">⬅ Voltar aos jogos</a><a href="../index.html">🏠 Página inicial</a></nav></header>
<main>
<section class="intro"><h1><span class="bolt">⚡</span> PENSA RÁPIDO! <span class="bolt">⚡</span></h1><p>Treina o cálculo mental, diverte-te e supera o teu recorde!</p></section>
<section id="menu"><p class="lead">🎯 Escolhe o teu desafio!</p><div class="levels"><button class="level-btn" onclick="startGame(1)">🌱 Nível 1: Até 20<small>Primeiros cálculos</small></button><button class="level-btn" onclick="startGame(2)">🚀 Nível 2: Até 50<small>Um pouco mais difícil</small></button><button class="level-btn" onclick="startGame(3)">⭐ Nível 3: Até 100<small>Mostra o que sabes!</small></button><button class="level-btn" onclick="startGame(4)">🏆 Nível 4: Até 999<small>Grande desafio</small></button></div><img class="mascot" src="imagens-pensarapido/menino.png" alt="Menino a pensar"><p>⏱️ Tens 5 minutos para acertar no máximo de operações!</p></section>
<section id="panel" aria-label="Pontuação e tempo"><div class="stat" id="score">⭐ Pontuação: 0</div><div class="stat" id="errors">❌ Erros: 0</div><div class="stat" id="timer">⏱️ Tempo: 5:00</div></section>
<section id="game" aria-label="Jogo de cálculo mental"><div class="question" id="question">0 + 0</div><div class="answer-row"><label for="answer" style="font-weight:900">Resposta:</label><input type="number" id="answer" inputmode="numeric" autocomplete="off" aria-label="Resposta à operação"><button class="action" id="respond" onclick="checkAnswer()">Responder ✓</button></div><div id="feedback" role="status" aria-live="polite"></div><div id="character" aria-hidden="true">🙂</div><div id="medal" aria-label="Medalha final"></div><div class="actions"><button class="action secondary" onclick="backToMenu()">↩ Escolher outro nível</button><a class="action secondary" id="backYearBottom" href="../1-ano/index.html" style="display:inline-block;background:#eaf4ff;color:#073b78;border-radius:15px;padding:16px 20px;font-weight:900">⬅ Voltar aos jogos</a></div></section>
</main>
<script>
'use strict';
const ano=new URLSearchParams(location.search).get('ano');
const anoValido=['1','2','3','4'].includes(ano)?ano:'1';
const destino=`../${anoValido}-ano/index.html`;
document.getElementById('backYear').href=destino;
document.getElementById('backYearBottom').href=destino;
let num1,num2,correctAnswer,score=0,errors=0,timeLeft=300,timer=null,level=1,finished=false;
const question=document.getElementById('question'),answer=document.getElementById('answer'),feedback=document.getElementById('feedback'),scoreDisplay=document.getElementById('score'),errorsDisplay=document.getElementById('errors'),timerDisplay=document.getElementById('timer'),menu=document.getElementById('menu'),panel=document.getElementById('panel'),gameDiv=document.getElementById('game'),character=document.getElementById('character'),medal=document.getElementById('medal'),respond=document.getElementById('respond');
function startGame(selectedLevel){clearInterval(timer);level=selectedLevel;score=0;errors=0;timeLeft=300;finished=false;menu.style.display='none';panel.style.display='flex';gameDiv.style.display='block';scoreDisplay.textContent='⭐ Pontuação: 0';errorsDisplay.textContent='❌ Erros: 0';timerDisplay.textContent='⏱️ Tempo: 5:00';feedback.textContent='';character.textContent='🙂';medal.textContent='';answer.disabled=false;respond.disabled=false;newQuestion();startTimer()}
function newQuestion(){let min=0,max=20;if(level===2){max=50}else if(level===3){max=100}else if(level===4){max=999}
if(Math.random()>.5){correctAnswer=Math.floor(Math.random()*(max-min+1))+min;num1=Math.floor(Math.random()*(correctAnswer+1));num2=correctAnswer-num1;question.textContent=`${num1} + ${num2}`}else{num1=Math.floor(Math.random()*(max+1));num2=Math.floor(Math.random()*(num1+1));correctAnswer=num1-num2;question.textContent=`${num1} − ${num2}`}answer.value='';answer.focus()}
function checkAnswer(){if(finished||answer.disabled||answer.value.trim()==='')return;const userAnswer=Number(answer.value);if(userAnswer===correctAnswer){score++;feedback.textContent='🎉 Muito bem!';character.textContent='😄';createStars()}else{errors++;errorsDisplay.textContent='❌ Erros: '+errors;feedback.textContent=`❌ O correto era: ${correctAnswer}`;character.textContent='🙂'}scoreDisplay.textContent='⭐ Pontuação: '+score;newQuestion()}
function createStars(){for(let i=0;i<6;i++){const star=document.createElement('div');star.className='star';star.textContent='⭐';star.style.left=(10+Math.random()*80)+'%';star.style.top='48%';gameDiv.appendChild(star);setTimeout(()=>star.remove(),1000)}}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{timeLeft--;const minutes=Math.floor(timeLeft/60),seconds=timeLeft%60;timerDisplay.textContent='⏱️ Tempo: '+minutes+':'+String(seconds).padStart(2,'0');if(timeLeft<=0){clearInterval(timer);endGame()}},1000)}
function endGame(){finished=true;question.textContent='🏁 FIM!';answer.disabled=true;respond.disabled=true;feedback.textContent='Pontuação final: '+score;character.textContent='🏆';medal.textContent=score<=5?'🥉':score<=10?'🥈':'🥇'}
function backToMenu(){clearInterval(timer);finished=true;menu.style.display='block';panel.style.display='none';gameDiv.style.display='none'}
answer.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkAnswer()}});
</script>
</body></html>
