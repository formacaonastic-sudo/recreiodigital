const completed=new Set();let current=0,chosen=1,painted=[],dragging=false,finished=false,advanceTimer=null;
const $=id=>document.getElementById(id);
function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';u.rate=.86;speechSynthesis.speak(u)}
function draw(canvas,m){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,300,300);m.grade.forEach((c,i)=>{ctx.fillStyle=m.cores[c];ctx.fillRect((i%10)*30,Math.floor(i/10)*30,30,30)})}

function ativarPincel(cor){

  $('board').style.setProperty('--pincel-cursor',url);
  $('board').classList.add('brush-ready');
}
function buildPalette(){let m=MODELS[current];$('palette').replaceChildren();for(let k=1;k<m.cores.length;k++){let b=document.createElement('button');b.className='swatch'+(chosen===k?' active':'');b.style.background=m.cores[k];b.title='Cor '+k;b.setAttribute('aria-label','Selecionar cor '+k);b.onclick=()=>{chosen=k;ativarPincel(m.cores[k]);buildPalette();refreshDots()};$('palette').append(b)}}
function buildBoard(){$('board').replaceChildren();MODELS[current].grade.forEach((v,i)=>{let b=document.createElement('div');b.className='cell';b.dataset.i=i;b.dataset.expected=v;b.setAttribute('role','button');b.setAttribute('aria-label',v?'Quadradinho por pintar':'Fundo');b.addEventListener('pointerdown',e=>{dragging=true;try{b.setPointerCapture(e.pointerId)}catch{}paint(i)});b.addEventListener('pointerenter',()=>{if(dragging)paint(i)});$('board').append(b)});refreshDots()}
function refreshDots(){let m=MODELS[current];[...$('board').children].forEach((b,i)=>{let v=m.grade[i];b.className='cell'+(painted[i]?' filled':v?' dot':'');b.style.background=painted[i]?m.cores[painted[i]]:'#eef3fa';b.style.setProperty('--hint',m.cores[v]||'transparent');b.style.opacity=v===0?'.65':'1'})}
function paint(i){if(finished)return;let m=MODELS[current],v=m.grade[i];if(!v||painted[i])return;if(chosen!==v){$('message').textContent='Experimenta a cor do pontinho!';return}painted[i]=v;let b=$('board').children[i];b.className='cell filled';b.style.background=m.cores[v];update();if(painted.filter(Boolean).length===m.grade.filter(Boolean).length){finished=true;completed.add(current);$('success').classList.remove('hidden');$('message').textContent='Fantástico! Desenho terminado!';speak('Parabéns! Completaste o desenho '+m.nome+'. Muito bem!');$('message').textContent='Fantástico! Próximo desenho em 3 segundos…';advanceTimer=setTimeout(()=>start((current+1)%MODELS.length),3000)}}
function update(){let total=MODELS[current].grade.filter(Boolean).length,n=painted.filter(Boolean).length,p=Math.round(n/total*100);$('counter').textContent=`${n} / ${total} · ${p}%`;$('bar').style.width=p+'%'}
document.addEventListener('pointerup',()=>dragging=false);document.addEventListener('pointercancel',()=>dragging=false);
$('back').onclick=()=>{clearTimeout(advanceTimer);advanceTimer=null;$('game').classList.add('hidden');$('selection').classList.remove('hidden');gallery();speechSynthesis?.cancel?.()};$('reset').onclick=()=>start(current);$('next').onclick=()=>start((current+1)%MODELS.length);$('continue').onclick=()=>start((current+1)%MODELS.length);$('voice').onclick=()=>speak('Seleciona uma cor na paleta. Depois pinta os quadradinhos com os pontinhos dessa cor.');$('hint').onclick=()=>{let m=MODELS[current];let idx=m.grade.findIndex((v,i)=>v===chosen&&!painted[i]);if(idx<0)idx=m.grade.findIndex((v,i)=>v&&!painted[i]);if(idx>=0){let b=$('board').children[idx];b.animate([{outline:'4px solid #ffb300'},{outline:'4px solid transparent'},{outline:'4px solid #ffb300'}],{duration:1200,iterations:2});$('message').textContent='Procura o quadradinho que está a piscar!'}};
// Os caminhos são relativos à pasta 1-ano, onde o jogo será guardado.
document.querySelector('header a:first-of-type').href='../index.html';$('menu-link').href='index.html';gallery();
</script></body></html>
