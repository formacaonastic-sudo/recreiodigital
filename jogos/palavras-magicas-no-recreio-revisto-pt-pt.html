function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(good=true){
 if(muted)return;
 try{
  audio??=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  const t=audio.currentTime+.012;
  const notes=good?[[523.25,0,.13],[659.25,.115,.13],[783.99,.23,.19]]:[[392,0,.11],[329.63,.14,.17]];
  for(const [frequency,offset,duration] of notes){
   const osc=audio.createOscillator(),gain=audio.createGain();
   osc.type=good?'sine':'triangle';
   osc.frequency.setValueAtTime(frequency,t+offset);
   osc.connect(gain);gain.connect(audio.destination);
   gain.gain.setValueAtTime(.0001,t+offset);
   gain.gain.exponentialRampToValueAtTime(good?.085:.045,t+offset+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,t+offset+duration);
   osc.start(t+offset);osc.stop(t+offset+duration+.02);
  }
 }catch(e){}
}
function party(){const colors=['#ffcc53','#ff86b1','#62d9a6','#7ec8ff','#c4a2ff'];for(let i=0;i<42;i++){let el=document.createElement('span');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%colors.length];el.style.animationDelay=Math.random()*.35+'s';document.body.append(el);setTimeout(()=>el.remove(),2300)}}
function init(){clearTimeout(nextTimer);queue=shuffle(sets[year]);done=0;wins=0;$('back').href=`../${year}-ano/`;for(let y=1;y<=4;y++)$('year'+y).setAttribute('aria-pressed',year===y);next()}
function next(){clearTimeout(nextTimer);if(!queue.length){queue=shuffle(sets[year]);if(queue.length>1&&queue[0][0]===previousWord)[queue[0],queue[1]]=[queue[1],queue[0]];done=0}current=queue.shift();previousWord=current[0];done++;chosen=[];locked=false;$('picture').textContent=current[1];$('picture').setAttribute('aria-label','Ilustração que representa a palavra a descobrir');$('message').textContent='';buttons=shuffle([...current[0]].map((letter,id)=>({letter,id})));render();stats()}
function stats(){$('progress').textContent=`📝 ${done} / ${sets[year].length}`;$('score').textContent=`⭐ ${wins}`}

function pick(b){if(locked||chosen.some(x=>x.id===b.id))return;chosen.push(b);render();const typed=chosen.map(x=>x.letter).join('');if(!current[0].startsWith(typed)){$('message').textContent='💛 Boa tentativa! Experimenta outra letra.';tone(false);locked=true;nextTimer=setTimeout(()=>{chosen.pop();locked=false;$('message').textContent='';render()},700);return}tone(true);if(typed===current[0]){locked=true;wins++;stats();$('message').textContent='🎉 Muito bem! Palavra descoberta!';party();nextTimer=setTimeout(next,1750)}else{$('message').textContent='✨ Continua!'}}
$('undo').onclick=()=>{if(locked)return;chosen.pop();$('message').textContent='';render()};$('skip').onclick=next;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Sem som':'🔊 Som'};$('year1').onclick=()=>{year=1;init()};$('year2').onclick=()=>{year=2;init()};$('year3').onclick=()=>{year=3;init()};$('year4').onclick=()=>{year=4;init()};init();
