<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Corrida dos Ordinais · Recreio Digital</title><style>
:root{--navy:#142e53;--blue:#20599b;--yellow:#ffd45d;--paper:#fffefa;--ink:#173254}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at 15% 15%,#dff4ff,transparent 35%),linear-gradient(145deg,#7bc4f4,#d6f1ff 55%,#fff3ca);color:var(--ink);min-height:100vh}.top{background:#142e53;color:white;padding:12px max(18px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:1.2rem;font-weight:900}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{color:#142e53;text-decoration:none;background:#fff;border-radius:12px;padding:9px 13px;font-weight:800}.wrap{max-width:1080px;margin:auto;padding:20px 14px 30px}.hero{background:linear-gradient(115deg,#194b88,#287dc1);border:4px solid #fff;border-radius:25px;padding:19px;color:white;box-shadow:0 12px 25px #214e8130;text-align:center}.hero h1{margin:0;font-size:clamp(1.8rem,5vw,3.2rem)}.hero p{margin:6px 0 0;font-size:1.05rem}.track{display:flex;align-items:center;justify-content:space-around;font-size:clamp(2rem,6vw,3.5rem);margin-top:9px}.card{background:var(--paper);border:3px solid #fff;border-radius:26px;box-shadow:0 12px 32px #18466b26;padding:clamp(17px,4vw,30px);margin-top:16px}.hidden{display:none!important}.chooser{text-align:center}.chooser h2{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 17px}.years{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.year{background:#eaf6ff;border:3px solid #9dcdf0;border-radius:19px;padding:20px 8px;cursor:pointer;font-size:1.25rem;font-weight:900;color:var(--navy)}.year small{display:block;font-size:.85rem;margin-top:6px}.year:hover,.year:focus-visible{background:#ffedac;border-color:#efbd42}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{border-radius:15px;background:#e9f5ff;padding:12px;text-align:center;font-size:.9rem;font-weight:800}.stat strong{display:block;font-size:clamp(1.2rem,3vw,1.8rem)}.stat.good{background:#ddf9e5}.stat.bad{background:#ffe4e4}.bar{height:14px;background:#dce9f4;border-radius:20px;overflow:hidden;margin:17px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffcb45,#ff8d3d);transition:width .3s}.mode{display:block;margin:10px auto 14px;width:fit-content;max-width:100%;background:#ffdf74;border-radius:999px;padding:10px 22px;text-align:center;font-weight:900;font-size:clamp(1rem,2.7vw,1.3rem)}.question{text-align:center;font-size:clamp(1.25rem,3.2vw,2rem);font-weight:900;margin:12px 0}.symbol{margin:14px auto 21px;background:#e9f5ff;border:3px solid #a5c9e9;border-radius:20px;min-height:98px;display:flex;justify-content:center;align-items:center;text-align:center;padding:15px 20px;max-width:100%;font-size:clamp(1.55rem,5vw,3.2rem);font-weight:1000;overflow-wrap:anywhere;line-height:1.25}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.answer{min-height:82px;border-radius:18px;border:3px solid #a7c6e7;background:#f2f8ff;font-size:clamp(1.1rem,2.6vw,1.55rem);font-weight:900;color:var(--navy);padding:13px;cursor:pointer;overflow-wrap:anywhere;transition:transform .12s}.answer:nth-child(2){background:#fff3d3;border-color:#eacb80}.answer:nth-child(3){background:#eaf8e5;border-color:#abd49c}.answer:nth-child(4){background:#f8eafd;border-color:#d4aceb}.answer:hover:not(:disabled){transform:translateY(-3px)}.answer:disabled{cursor:default}.answer.correct{background:#38b970!important;border-color:#168249!important;color:white}.answer.wrong{background:#ed6672!important;border-color:#b8303d!important;color:white}.feedback{min-height:34px;text-align:center;font-size:1.2rem;font-weight:900;margin:14px 0 0}.foot{text-align:center;color:#204a70;font-weight:800;padding:15px}.action{background:#ffcb45;color:#173254;border:0;border-radius:16px;font-size:1.1rem;font-weight:900;padding:14px 25px;cursor:pointer}.end{text-align:center}.end h2{font-size:2rem}.end .score{font-size:3rem;font-weight:1000;color:#1c629c}@media(max-width:580px){.years{grid-template-columns:1fr}.answers{gap:9px}.answer{min-height:75px;padding:9px}.top{justify-content:center}.stats{gap:5px}.stat{padding:9px 3px}}

/* Acabamento visual da Corrida dos Ordinais */
body{background:radial-gradient(circle at 8% 20%,#fff9dc 0 8%,transparent 28%),radial-gradient(circle at 92% 36%,#bdeaff 0 8%,transparent 35%),linear-gradient(145deg,#75bafa 0%,#d9f2ff 54%,#fff0c4 100%)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#12386f,#246cbb 55%,#329ac9);border:4px solid #fdf6dc;box-shadow:0 12px 0 #19477a24,0 18px 38px #18466b36}
.hero:before,.hero:after{content:'✦';position:absolute;color:#ffe583;opacity:.85;font-size:2.1rem;top:13px;left:20px}.hero:after{content:'★';left:auto;right:23px;top:22px;font-size:1.7rem}
.hero h1{text-shadow:0 3px 0 #10325c;font-weight:1000}.hero p{font-weight:750;color:#fff6cf}.track{padding:5px 14px 2px;background:#ffffff1a;border-radius:24px;margin:15px auto 0;max-width:620px}
.card{border:3px solid #fff;box-shadow:0 8px 0 #1e578b15,0 18px 40px #164f8b1d}
.stat{border:2px solid #d1e6f8;box-shadow:inset 0 2px 0 #fff}.stat.good{border-color:#9ae4b0}.stat.bad{border-color:#ffc2c2}.stat strong{font-weight:1000}
.bar{height:18px;border:2px solid #c6e2f5;background:#e9f3fc;margin:19px 0}.fill{background:linear-gradient(90deg,#ffcf4b,#ffa047,#ffdd66)}
.mode{background:linear-gradient(110deg,#ffde76,#ffc84e);border:2px solid #f0b63b;box-shadow:0 4px 0 #d99a2766;color:#6c3b09}
.question{color:#143b68}.symbol{background:linear-gradient(180deg,#fff8dd,#fffdf3);border:4px solid #f4d47e;box-shadow:0 6px 0 #e8cb853b;font-size:clamp(1.65rem,4.6vw,3rem);min-height:108px;letter-spacing:.015em}
.answer{box-shadow:0 5px 0 #7ba6ca50,0 8px 12px #134c7c12;transition:transform .14s,box-shadow .14s}.answer:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 8px 0 #7ba6ca50,0 12px 15px #134c7c17}.answer:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #7ba6ca50}.answer:focus-visible,.year:focus-visible,.action:focus-visible{outline:4px solid #ffbd33;outline-offset:3px}
.feedback{border-radius:15px;padding:8px 10px;min-height:52px;display:flex;align-items:center;justify-content:center}.feedback.positive{background:#e2fbe8;color:#13733d;animation:pop .3s ease-out}.feedback.negative{background:#fff0e5;color:#a3431a}
.foot{font-size:1.02rem;background:#ffffff91;margin:14px auto 0;width:fit-content;border-radius:999px;padding:12px 24px}
.confetti-layer{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}.falling-number{position:absolute;top:-70px;font-weight:1000;line-height:1;color:var(--fall-color);text-shadow:0 2px 0 #ffffffaa;animation:numberFall var(--fall-duration) cubic-bezier(.2,.7,.6,1) forwards;animation-delay:var(--fall-delay);will-change:transform,opacity}
@keyframes numberFall{0%{transform:translate3d(0,-30px,0) rotate(-25deg) scale(.7);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(var(--spin)) scale(1.1);opacity:0}}
@keyframes pop{0%{transform:scale(.96)}75%{transform:scale(1.02)}100%{transform:scale(1)}}
@media(max-width:580px){.hero:before,.hero:after{display:none}.hero{padding:17px 9px}.track{font-size:clamp(1.5rem,7vw,2.3rem)}.answer{font-size:clamp(.97rem,3.6vw,1.35rem)}.symbol{font-size:clamp(1.35rem,5.4vw,2.3rem)}.foot{border-radius:14px;width:calc(100% - 20px)}}
@media(prefers-reduced-motion:reduce){.falling-number{animation:none;display:none}.feedback.positive{animation:none}.answer{transition:none}}
</style></head><body><header class="top"><div class="brand">🦉 Recreio Digital</div><nav class="links"><a id="back" href="../2-ano/index.html">↩ Voltar aos jogos</a><a href="../index.html">🏠 Página inicial</a></nav></header><main class="wrap"><div class="hero"><h1>🏆 A Corrida dos Ordinais</h1><p>Descobre as posições e conquista o pódio!</p><div class="track" aria-hidden="true"><span>🏃</span><span>🥉</span><span>🥈</span><span>🥇</span><span>🏆</span></div></div><section id="chooser" class="card chooser"><h2>Escolhe o teu ano de escolaridade</h2><div class="years"><button class="year" data-year="2">2.º ano<small>Do 1.º ao 20.º</small></button><button class="year" data-year="3">3.º ano<small>Do 1.º ao 100.º</small></button><button class="year" data-year="4">4.º ano<small>Do 1.º ao 1000.º</small></button></div></section><section id="game" class="card hidden"><div class="stats"><div class="stat">Pergunta<strong id="number">1 / 20</strong></div><div class="stat good">✅ Certas<strong id="right">0</strong></div><div class="stat bad">❌ Erradas<strong id="wrong">0</strong></div></div><div class="bar"><div class="fill" id="fill"></div></div><div id="mode" class="mode"></div><div id="question" class="question"></div><div id="symbol" class="symbol"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></section><section id="end" class="card end hidden"><h2>🏆 Corrida terminada!</h2><div class="score" id="finalScore"></div><p id="finalMessage"></p><button class="action" id="again">🔄 Jogar novamente</button></section></main><div id="confetti" class="confetti-layer" aria-hidden="true"></div><footer class="foot">Feito com ❤️ para aprender e brincar · Recreio Digital</footer><script>
'use strict';const U=['','primeiro','segundo','terceiro','quarto','quinto','sexto','sétimo','oitavo','nono'];const T=['','décimo','vigésimo','trigésimo','quadragésimo','quinquagésimo','sexagésimo','septuagésimo','octogésimo','nonagésimo'];const H=['','centésimo','ducentésimo','tricentésimo','quadringentésimo','quingentésimo','sexcentésimo','septingentésimo','octingentésimo','nongentésimo'];function ordinal(n){if(n===1000)return 'milésimo';let a=[];if(n>=1000){a.push('milésimo');n%=1000}if(n>=100){a.push(H[Math.floor(n/100)]);n%=100}if(n>=10){a.push(T[Math.floor(n/10)]);n%=10}if(n>0)a.push(U[n]);return a.join(' ')}function fmt(n){return n+'.º'}function rand(max){return Math.floor(Math.random()*max)+1}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let year=Number(params.get('ano')),limit=20,items=[],idx=0,correct=0,incorrect=0,locked=false,timer=null;function setBack(y){$('back').href='../'+y+'-ano/index.html'}function pickQuestions(max){let chosen=new Set();while(chosen.size<20)chosen.add(rand(max));return shuffle([...chosen].map((n,i)=>({n,type:i%2===0?'words':'number'})))}function distractors(n,max){let s=new Set([n]);let offsets=[1,-1,2,-2,5,-5,10,-10,20,-20,50,-50,100,-100];shuffle(offsets);for(let d of offsets){let v=n+d;if(v>=1&&v<=max)s.add(v);if(s.size===4)break}while(s.size<4)s.add(rand(max));return shuffle([...s])}function start(y){clearTimeout(timer);year=y;limit=y===2?20:y===3?100:1000;setBack(y);$('chooser').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');items=pickQuestions(limit);idx=correct=incorrect=0;render()}function render(){locked=false;const item=items[idx];$('number').textContent=(idx+1)+' / 20';$('right').textContent=correct;$('wrong').textContent=incorrect;$('fill').style.width=(idx/20*100)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('mode').textContent=item.type==='words'?'🔢 Do número para o ordinal':'🔤 Do ordinal para o número';$('question').textContent=item.type==='words'?'Como se lê este número ordinal?':'Como se escreve este ordinal em algarismos?';$('symbol').textContent=item.type==='words'?fmt(item.n):ordinal(item.n);const holder=$('answers');holder.replaceChildren();for(const v of distractors(item.n,limit)){let b=document.createElement('button');b.className='answer';b.textContent=item.type==='words'?ordinal(v):fmt(v);b.addEventListener('click',()=>respond(v,b,item.n));holder.append(b)}}
function showerOfNumbers(){const layer=$('confetti');layer.replaceChildren();const symbols=['1.º','2.º','3.º','4.º','5.º','10.º','20.º','★','✦','🏆'];const colors=['#f4b52c','#1877bf','#19a86b','#a457d4','#e9635b'];for(let i=0;i<30;i++){const el=document.createElement('span');el.className='falling-number';el.textContent=symbols[Math.floor(Math.random()*symbols.length)];el.style.left=(Math.random()*96)+'%';el.style.fontSize=(19+Math.random()*23)+'px';el.style.setProperty('--fall-color',colors[i%colors.length]);el.style.setProperty('--fall-delay',(Math.random()*.45)+'s');el.style.setProperty('--fall-duration',(1.65+Math.random()*.75)+'s');el.style.setProperty('--drift',((Math.random()-.5)*180)+'px');el.style.setProperty('--spin',((Math.random()-.5)*640)+'deg');layer.append(el)}setTimeout(()=>layer.replaceChildren(),3000)}
function respond(v,btn,n){if(locked)return;locked=true;const ok=v===n;if(ok){correct++;btn.classList.add('correct');$('feedback').className='feedback positive';$('feedback').textContent='🎉 Muito bem! Resposta certa!';showerOfNumbers()}else{incorrect++;btn.classList.add('wrong');$('feedback').className='feedback negative';$('feedback').textContent='💪 A resposta certa é '+fmt(n)+' — '+ordinal(n)+'.';for(const b of $('answers').children){if(b.textContent=== (items[idx].type==='words'?ordinal(n):fmt(n)))b.classList.add('correct')}}for(const b of $('answers').children)b.disabled=true;$('right').textContent=correct;$('wrong').textContent=incorrect;timer=setTimeout(()=>{idx++;if(idx<20)render();else finish()},ok?1050:1900)}function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('finalScore').textContent=correct+' / 20';$('finalMessage').textContent='✅ '+correct+' respostas certas · ❌ '+incorrect+' respostas erradas. '+(correct>=17?'Excelente corrida! 🥇':correct>=11?'Muito bem! Continua a praticar! 🥈':'Continua a treinar, vais conseguir! 🏃');$('fill').style.width='100%'}document.querySelectorAll('[data-year]').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.year))));$('again').addEventListener('click',()=>start(year));if([2,3,4].includes(year))start(year);else{year=2;setBack(year)}
</script></body></html>
