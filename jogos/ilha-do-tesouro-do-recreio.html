<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Ilha do Tesouro do Recreio — Puzzles</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;color:#163b60;background:linear-gradient(165deg,#8ddbf6,#c3f4dd 52%,#ffe3a4);min-height:100vh}header{background:#173b65;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header a{color:#fff;text-decoration:none;background:#ffffff29;padding:9px 13px;border-radius:12px;font-weight:700}main{max-width:1050px;margin:auto;padding:14px}h1{text-align:center;font-size:clamp(26px,4vw,42px);margin:8px 0}.lead{text-align:center;font-weight:800;font-size:21px;margin:0 0 12px}.card{background:#fffcf0;border:5px solid #e2b65b;border-radius:25px;padding:17px;box-shadow:0 9px 0 #967e4d2e}.hide{display:none!important}.btn{font:900 21px system-ui;border:0;border-radius:16px;background:#ffcf51;color:#173b65;padding:13px 20px;box-shadow:0 5px 0 #d6a12d;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(3px)}.btn:focus-visible,.piece:focus-visible,.slot:focus-visible{outline:4px solid #ff863a;outline-offset:2px}.center{text-align:center}.map{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:16px 0}.island{width:clamp(55px,12vw,92px);background:#d6f6e8;border:3px solid #fff;border-radius:17px;padding:9px 3px;font-size:clamp(31px,5vw,50px);text-align:center}.island small{display:block;font-size:12px;font-weight:900}.island.locked{filter:grayscale(1);opacity:.55}.island.done{background:#b7eeb5}.stagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900;font-size:19px;margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.board{width:min(100%,410px);aspect-ratio:1;display:grid;gap:3px;margin:auto;background:#cba06b;border:7px solid #9f7140;border-radius:12px;overflow:hidden}.slot{position:relative;border:2px dashed #b28a57;background:#ffedce;cursor:pointer;overflow:hidden;min-width:0;min-height:0}.slot.filled{border:1px solid #ffffff6e}.slot .crop,.piece .crop{position:absolute;inset:0;background-repeat:no-repeat}.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding:12px;background:#f4dfb6;border-radius:16px;border:3px solid #e0b36d;min-height:170px}.piece{aspect-ratio:1;position:relative;cursor:grab;border:3px solid #fff;border-radius:9px;overflow:hidden;box-shadow:0 3px 5px #0003;background:#fff;touch-action:manipulation}.piece.chosen{outline:5px solid #f57f28;transform:scale(.96)}.piece:active{cursor:grabbing}.preview{width:min(100%,165px);aspect-ratio:1;display:block;margin:0 auto 10px;border:4px solid white;border-radius:14px;box-shadow:0 3px 8px #0002}.instruction{text-align:center;font-size:19px;font-weight:850;margin:10px 0}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:13px}.progress{height:14px;background:#dfebed;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#55c47b,#f2c746);transition:width .25s}.finalpic{font-size:clamp(70px,14vw,130px);margin:12px}.fall{position:fixed;top:-50px;pointer-events:none;z-index:99;animation:drop 2.8s linear forwards;font-size:32px}@keyframes drop{to{transform:translateY(110vh) rotate(580deg);opacity:0}}@media(max-width:710px){.layout{grid-template-columns:1fr}.tray{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:10px}.preview{width:110px}.instruction{font-size:17px}}
</style></head><body><header><strong>🦉 Recreio Digital</strong><nav><a href="../pre-escolar/index.html">⬅️ Pré-escolar</a> <a href="../index.html">🏠 Início</a></nav></header><main><h1>🏝️ A Ilha do Tesouro do Recreio</h1><p class="lead">🏴‍☠️ 🧩 ⭐ 💰</p>
<section id="intro" class="card center"><div style="font-size:clamp(65px,12vw,110px)">🏴‍☠️ 🗺️ 🦜</div><p style="font-size:22px;font-weight:900">👆 🧩 ➜ 🏝️ ➜ 💰</p><div class="map" id="introMap"></div><button class="btn" id="start">▶️ JOGAR</button><p>🔊 <span style="font-weight:700">Instruções por voz</span> <button class="btn" id="sound" style="font-size:17px;padding:8px 12px">Ligadas</button></p></section>
<section id="play" class="card hide"><div class="stagehead"><span id="stageName"></span><span id="counter"></span></div><div class="map" id="playMap"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="instruction" id="hint">👆 🧩 ➜ ⬜</div><div class="layout"><div><div class="board" id="board" aria-label="Puzzle"></div></div><div><img id="preview" class="preview" alt="Imagem do puzzle completo"><div class="tray" id="tray" aria-label="Peças do puzzle"></div><div class="row"><button class="btn" id="help">👀 Ver imagem</button><button class="btn" id="listen">🔊 Ouvir</button></div></div></div><div class="row"><button class="btn hide" id="next">➡️ Próxima ilha</button></div></section>
<section id="end" class="card center hide"><div class="finalpic">🏴‍☠️ 💰 🎉</div><h2>⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐</h2><p style="font-size:26px;font-weight:900">TESOURO ENCONTRADO!</p><button class="btn" id="again">🔁 JOGAR</button></section>
<footer class="center" style="padding:20px;font-weight:700">Feito com ❤️ para aprender e brincar · Recreio Digital</footer></main>
<script>
const $=id=>document.getElementById(id);
const scenes=[
{name:'🚢 O Navio Pirata',emoji:'🚢',cols:2,rows:2,theme:['#83d7fa','#0e82ba','#fce7aa'],objects:[['⛵',270,260,230],['☁️',130,80,90],['🐬',100,390,95],['🌞',440,80,105]]},
{name:'🏖️ A Praia Misteriosa',emoji:'🏖️',cols:3,rows:2,theme:['#83e5f4','#2ac9b7','#ffe5a5'],objects:[['🌴',130,280,250],['🥥',300,370,100],['🦀',435,445,105],['🌞',445,100,105],['🐚',290,475,80]]},
{name:'🦜 A Floresta Encantada',emoji:'🦜',cols:3,rows:3,theme:['#a1ebf0','#4bbf7b','#b7df71'],objects:[['🌳',120,300,220],['🌴',470,275,205],['🦜',290,250,170],['🌺',175,490,100],['🦋',445,110,100],['🍄',420,475,100]]},
{name:'🦇 A Gruta Secreta',emoji:'🦇',cols:3,rows:3,theme:['#b1c5e9','#a5b2b3','#e4c58e'],objects:[['🪨',125,370,210],['🗝️',315,355,180],['🦇',450,145,115],['🔦',170,175,110],['💎',430,450,125]]},
{name:'🐢 A Baía das Tartarugas',emoji:'🐢',cols:3,rows:2,theme:['#a0edff','#25a6cc','#f8e1a1'],objects:[['🐢',290,330,205],['🐠',115,260,120],['🐟',480,390,130],['🪸',175,470,115],['🫧',450,150,105]]},
{name:'🐒 A Montanha dos Macacos',emoji:'🐒',cols:3,rows:3,theme:['#b3ecff','#7ac775','#e3cb8e'],objects:[['🐒',280,280,215],['🌴',100,310,205],['🍌',450,380,135],['🦋',450,115,110],['🌺',175,475,100]]},
{name:'🧜 A Lagoa Mágica',emoji:'🧜',cols:4,rows:3,theme:['#a8e9fa','#43b6cf','#e3d7ae'],objects:[['🧜‍♀️',300,310,220],['🐬',100,290,130],['🐙',480,390,135],['🐚',170,480,110],['⭐',440,120,100]]},
{name:'🏰 O Castelo da Ilha',emoji:'🏰',cols:4,rows:3,theme:['#a3d9ff','#79cbb0','#f4db9e'],objects:[['🏰',295,310,275],['🦜',110,205,135],['🗝️',475,420,130],['🌈',425,150,125],['🌴',105,440,140]]},
{name:'💰 O Grande Tesouro',emoji:'💰',cols:4,rows:4,theme:['#91d9ff','#28b5ad','#f8db95'],objects:[['🏴‍☠️',115,170,160],['🗝️',470,160,100],['💰',305,330,235],['💎',150,440,105],['⭐',475,455,100],['✨',300,100,110]]}
];
function svg(scene){let [sky,sea,sand]=scene.theme;let objs=scene.objects.map(([e,x,y,size])=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-family="Segoe UI Emoji,Apple Color Emoji,Noto Color Emoji,sans-serif">${e}</text>`).join('');return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="#e7faff"/></linearGradient></defs><rect width="600" height="600" fill="url(#s)"/><path d="M0 330 Q160 290 300 345 T600 330 V600 H0Z" fill="${sea}"/><path d="M0 445 Q170 380 300 460 T600 420 V600 H0Z" fill="${sand}"/><circle cx="500" cy="95" r="45" fill="#ffe781" opacity=".8"/>${objs}</svg>`}
let current=0,filled=0,selected=null,finished=false,voice=true,source='',order=[],advanceTimer=null;
function speak(t){if(!voice||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';u.rate=.88;window.speechSynthesis.speak(u)}
function confetti(){for(let i=0;i<38;i++){let e=document.createElement('div');e.className='fall';e.textContent=['⭐','💰','✨','🎉'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3700)}}
function drawMap(target){$(target).innerHTML=scenes.map((s,i)=>`<div class="island ${i<current?'done':i>current?'locked':''}">${i<current?'⭐':s.emoji}<small>${i+1}/${scenes.length}</small></div>`).join('')}
function bgStyle(index,cols,rows){let x=index%cols,y=Math.floor(index/cols);return `background-image:url('${source}');background-size:${cols*100}% ${rows*100}%;background-position:${cols===1?0:(x/(cols-1))*100}% ${rows===1?0:(y/(rows-1))*100}%;`}
function beginStage(){if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null}selected=null;filled=0;finished=false;let s=scenes[current];let n=s.cols*s.rows;source='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg(s));$('intro').classList.add('hide');$('end').classList.add('hide');$('play').classList.remove('hide');$('stageName').textContent=s.name;$('counter').textContent='🧩 0 / '+n;$('bar').style.width='0%';$('next').classList.add('hide');$('hint').textContent='👆 🧩 ➜ ⬜';$('preview').src=source;drawMap('playMap');$('board').style.gridTemplateColumns=`repeat(${s.cols},1fr)`;$('board').style.gridTemplateRows=`repeat(${s.rows},1fr)`;$('board').innerHTML='';$('tray').innerHTML='';$('tray').style.gridTemplateColumns=`repeat(${Math.min(n,4)},minmax(0,1fr))`;
for(let i=0;i<n;i++){let slot=document.createElement('button');slot.className='slot';slot.type='button';slot.dataset.slot=i;slot.setAttribute('aria-label','Lugar '+(i+1));slot.addEventListener('click',()=>place(i));slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',e=>{e.preventDefault();let k=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(k)) {selected=k;place(i)}});$('board').appendChild(slot)}
order=Array.from({length:n},(_,i)=>i).sort(()=>Math.random()-.5);for(let i=0;i<n;i++){let k=order[i];let p=document.createElement('button');p.className='piece';p.type='button';p.dataset.piece=k;p.draggable=true;p.setAttribute('aria-label','Peça '+(i+1));p.innerHTML=`<span class="crop" style="${bgStyle(k,s.cols,s.rows)}"></span>`;p.addEventListener('click',()=>{if(finished)return;selected=k;document.querySelectorAll('.piece').forEach(el=>el.classList.toggle('chosen',Number(el.dataset.piece)===k));speak('Agora toca no lugar certo.')});p.addEventListener('dragstart',e=>{selected=k;e.dataTransfer.setData('text/plain',String(k))});$('tray').appendChild(p)}speak('Vamos montar o puzzle! Escolhe uma peça e toca no lugar certo.')} 
function place(i){if(selected===null||finished)return;let s=scenes[current];let slot=$('board').children[i];if(slot.classList.contains('filled'))return;if(i!==selected){slot.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:230});speak('Experimenta outro lugar.');return}slot.classList.add('filled');slot.innerHTML=`<span class="crop" style="${bgStyle(selected,s.cols,s.rows)}"></span>`;let p=[...$('tray').children].find(el=>Number(el.dataset.piece)===selected);if(p)p.remove();selected=null;filled++;let n=s.cols*s.rows;$('counter').textContent=`🧩 ${filled} / ${n}`;$('bar').style.width=100*filled/n+'%';if(filled===n){finished=true;confetti();speak('Muito bem! Conseguiste montar o puzzle!');$('hint').textContent='🎉 ⭐ MUITO BEM! ⭐ 🎉';advanceTimer=setTimeout(()=>{advanceTimer=null;advanceStage()},2300)}else{speak(['Muito bem!','Boa!','Excelente!'][filled%3])}}
$('start').onclick=()=>{current=0;beginStage()};$('again').onclick=()=>{current=0;drawMap('introMap');$('end').classList.add('hide');$('intro').classList.remove('hide')};function advanceStage(){if(!finished)return;current++;if(current>=scenes.length){$('play').classList.add('hide');$('end').classList.remove('hide');confetti();speak('Parabéns, pequeno pirata! Encontraste o grande tesouro!')}else beginStage()}$('next').onclick=advanceStage;$('sound').onclick=()=>{voice=!voice;$('sound').textContent=voice?'Ligadas':'Desligadas';if(!voice&&'speechSynthesis'in window)window.speechSynthesis.cancel();else speak('Vamos jogar!')};$('listen').onclick=()=>speak('Escolhe uma peça do puzzle e toca no lugar certo.');$('help').onclick=()=>{let p=$('preview');p.animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:900});speak('Observa a imagem completa.')};drawMap('introMap');
</script></body></html>
