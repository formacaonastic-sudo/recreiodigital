<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Viagem Espacial dos Números | Recreio Digital</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#fff;background:#0b1534}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 20%,#294d8a 0,transparent 35%),radial-gradient(circle at 80% 80%,#432a73 0,transparent 40%),#09132e}.wrap{max-width:1180px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#e5efff;text-decoration:none;font-weight:700}h1{font-size:clamp(24px,4vw,38px);margin:14px 0 5px}.sub{color:#c8d7f8;margin:0 0 16px}.panel{background:#142653ee;border:1px solid #5772af;border-radius:22px;padding:18px;box-shadow:0 15px 35px #0005}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}select{width:100%;padding:12px;border-radius:12px;border:2px solid #789ce1;background:#f8fbff;color:#15345d;font-size:16px;font-weight:700}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0;color:#e3edff;font-weight:700}.scene{position:relative;overflow:hidden;border-radius:20px;min-height:315px;background:linear-gradient(140deg,#101a44,#1a3169 55%,#241b58);padding:22px 12px 14px}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#d6eaff 1px,transparent 1.5px);background-size:47px 47px,79px 79px;background-position:0 0,23px 16px;opacity:.5}.planet{position:absolute;right:24px;top:18px;width:66px;height:66px;border-radius:50%;background:linear-gradient(130deg,#f7cd69,#e27d86);box-shadow:inset -12px -9px 0 #a8508c55,0 0 35px #ffc57955}.planet:after{content:'';position:absolute;inset:25px -15px;border:6px solid #f9e1a4;border-radius:50%;transform:rotate(-23deg)}.planet.p1{background:linear-gradient(130deg,#7fe8dc,#3278d4)}.planet.p2{background:linear-gradient(130deg,#dca0ff,#6c61e8)}.planet.p3{background:linear-gradient(130deg,#ffb27e,#db5b70)}.scene h2{position:relative;text-align:center;font-size:clamp(17px,2.5vw,23px);margin:0 0 24px;max-width:75%}.pods{position:relative;display:flex;justify-content:center;gap:clamp(7px,2vw,20px);margin:0 auto 16px;max-width:920px}.pod{width:30%;max-width:260px;min-height:122px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(#55b4ee,#2175b8);border:4px solid #d9f3ff;border-radius:35px 35px 18px 18px;box-shadow:0 9px 0 #092a59,0 14px 15px #0006}.pod:nth-child(2){background:linear-gradient(#b29aff,#7253cf)}.pod:nth-child(3){background:linear-gradient(#54d6b8,#209b8a)}.pod.missing{background:linear-gradient(#ffe68a,#f6ae3c);border-color:#fff3d0}.window{background:#fff;border-radius:16px;width:85%;min-height:76px;display:flex;align-items:center;justify-content:center;color:#17355e;font-weight:900;font-size:clamp(22px,4.5vw,40px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:center;padding:5px}.pod:after{content:'🔥';font-size:22px;position:absolute;transform:translateY(71px)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 12px}button{cursor:pointer;font:inherit;font-weight:800;border-radius:14px;border:0;transition:transform .15s,box-shadow .15s}button:active{transform:scale(.97)}.choice{padding:14px 5px;font-size:clamp(17px,3vw,25px);color:#17345c;background:#f1f7ff;border:3px solid #b8d2f7;font-variant-numeric:tabular-nums}.choice.selected{background:#ffda57;border-color:#f39b28;box-shadow:0 0 0 3px #fff3}.choice:disabled{opacity:.8;cursor:default}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm{background:#16a34a;color:#ffffff;padding:15px;font-size:18px;box-shadow:0 5px 0 #116b34}.confirm:not(:disabled):hover{background:#15803d}.next{background:#ffcf4e;color:#183660;padding:15px;font-size:18px}.confirm:disabled{background:#6d947b;color:#ffffff;box-shadow:0 5px 0 #466b53;cursor:not-allowed;opacity:.8}.feedback{min-height:28px;text-align:center;font-weight:900;font-size:19px;margin:12px 0 0}.correct{color:#86ffc6}.wrong{color:#ffc1b8}.fly .pods{animation:fly 1.35s ease-in-out}.fly .stars{animation:starfly 1.35s linear}@keyframes fly{0%{transform:translateX(0)}45%{transform:translateX(35px) translateY(-9px)}100%{transform:translateX(120vw)}}@keyframes starfly{to{background-position:-170px 0,-110px 16px}}footer{text-align:center;color:#b5c8ec;padding:18px;font-size:13px}@media(max-width:560px){.wrap{padding:10px}.panel{padding:12px}.scene{min-height:230px;padding:18px 8px}.pod{min-height:82px;border-width:3px}.window{min-height:52px;font-size:clamp(17px,5vw,25px)}.pod:after{transform:translateY(55px);font-size:17px}.scene h2{margin-bottom:25px}.choices{gap:6px}.choice{padding:12px 2px}.actions button{font-size:14px;padding:12px 5px}}@media(prefers-reduced-motion:reduce){.fly .pods,.fly .stars{animation:none}}
.star-burst{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8}.falling-star{position:absolute;top:-42px;font-size:clamp(19px,3vw,32px);filter:drop-shadow(0 0 7px #ffe27c);animation:starfall var(--duration) ease-in forwards;animation-delay:var(--delay);left:var(--left)}@keyframes starfall{0%{transform:translate3d(0,-20px,0) rotate(0deg) scale(.5);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate3d(var(--drift),360px,0) rotate(var(--rotate)) scale(1.1);opacity:0}}.scene.celebrate{box-shadow:inset 0 0 55px #ffe87566,0 0 24px #ffe87544}.scene.celebrate .planet{filter:drop-shadow(0 0 14px #ffeaa1)}@media(prefers-reduced-motion:reduce){.falling-star{animation:none;display:none}}

</style></head><body><main class="wrap"><header><nav class="nav-buttons" aria-label="Navegação"><a class="nav-btn nav-back" id="back" href="../1-ano/index.html">← Voltar aos jogos</a><a class="nav-btn nav-home" href="../index.html">🏠 Página inicial</a></nav><button class="sound-toggle" id="sound" type="button" aria-pressed="true" title="Ligar ou desligar os sons">🔊 Som ligado</button></header><h1>🚀 A Viagem Espacial dos Números</h1><section class="panel"><div class="controls"><div><label for="level">🌟 Nível de dificuldade</label><select id="level"><option value="20">1.º ano · até 20</option><option value="100">2.º ano · até 100</option><option value="1000">3.º ano · até 1 000</option><option value="1000000">4.º ano · até 1 000 000</option></select></div><div><label for="kind">🪐 Tipo de missão</label><select id="kind"><option value="misto">Surpresa: antes, entre e depois</option><option value="antes">Número anterior</option><option value="entre">Número entre</option><option value="depois">Número seguinte</option></select></div></div><div class="status"><span id="mission">🚀 Missão 1</span><span>⭐ Acertos: <span id="score">0</span> · ❌ Erros: <span id="errors">0</span></span></div><div class="scene" id="scene"><div class="stars"></div><div class="star-burst" id="star-burst" aria-hidden="true"></div><div class="planet" id="planet"></div><h2 id="instruction">Qual é o número que falta?</h2><div class="pods" id="pods"><div class="pod"><div class="window" id="n0"></div></div><div class="pod"><div class="window" id="n1"></div></div><div class="pod"><div class="window" id="n2"></div></div></div></div><div class="choices" id="choices"></div><div class="actions"><button class="confirm" id="confirm" disabled>✓ Confirmar resposta</button><button class="next" id="new">🎲 Nova missão</button></div><p class="feedback" id="feedback" aria-live="polite"></p></section><footer>Feito com ❤️ para aprender e brincar · Recreio Digital</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),year=['1','2','3','4'].includes(params.get('ano'))?params.get('ano'):'1',limits={'1':20,'2':100,'3':1000,'4':1000000};$('back').href=`../${year}-ano/index.html`;$('level').value=String(limits[year]);let answer=0,selected=null,locked=false,mission=0,score=0,errors=0,timeout=null,lastKey='';const format=n=>n.toLocaleString('pt-PT'),rand=(min,max)=>min+Math.floor(Math.random()*(max-min+1));let audioContext=null,soundOn=true;
function audioReady(){if(!soundOn)return null;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext}catch(e){return null}}
function tone(freq,duration=0.15,delay=0,wave='sine',volume=0.08,endFreq=null){const ctx=audioReady();if(!ctx)return;const t=ctx.currentTime+delay;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,t);if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+duration);gain.gain.setValueAtTime(0.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(0.001,volume),t+0.018);gain.gain.exponentialRampToValueAtTime(0.0001,t+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+0.02)}
function soundSelect(){tone(550,.085,0,'sine',.045,720)}
function soundSuccess(){tone(392,.18,0,'sine',.07);tone(523,.18,.13,'sine',.07);tone(659,.2,.26,'sine',.075);tone(784,.38,.4,'triangle',.075);tone(130,.65,.42,'sawtooth',.022,320)}
function soundWrong(){tone(230,.19,0,'triangle',.045,175);tone(175,.24,.17,'triangle',.04,145)}
function soundLaunch(){tone(120,.42,0,'sawtooth',.02,390)}
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)soundSelect()});
function celebrate(){const layer=$('star-burst');layer.replaceChildren();$('scene').classList.add('celebrate');for(let i=0;i<24;i++){const star=document.createElement('span');star.className='falling-star';star.textContent=i%4===0?'✨':'⭐';star.style.setProperty('--left',rand(3,95)+'%');star.style.setProperty('--delay',(i%8)*.085+'s');star.style.setProperty('--duration',(1.05+Math.random()*.45)+'s');star.style.setProperty('--drift',rand(-55,55)+'px');star.style.setProperty('--rotate',rand(-240,240)+'deg');layer.appendChild(star)}}function make(){$('star-burst').replaceChildren();$('scene').classList.remove('celebrate');if(timeout){clearTimeout(timeout);timeout=null}$('scene').classList.remove('fly');locked=false;selected=null;$('feedback').textContent='';$('feedback').className='feedback';const max=Number($('level').value),mode=$('kind').value;let base,pos,key,tries=0;do{base=rand(0,max-2);pos=mode==='misto'?rand(0,2):({antes:0,entre:1,depois:2})[mode];key=base+'-'+pos;tries++}while(key===lastKey&&tries<30);lastKey=key;answer=base+pos;for(let i=0;i<3;i++){$('n'+i).textContent=i===pos?'?':format(base+i);$('n'+i).parentElement.classList.toggle('missing',i===pos)}$('instruction').textContent=pos===0?'🌠 Que número vem ANTES?':pos===1?'🛸 Que número fica ENTRE os outros dois?':'🪐 Que número vem DEPOIS?';let opts=new Set([answer]);let attempts=0;while(opts.size<4&&attempts<100){const delta=rand(-Math.min(10,max),Math.min(10,max));const n=answer+delta;if(n>=0&&n<=max)opts.add(n);attempts++}for(let n=0;opts.size<4&&n<=max;n++)opts.add(n);const shuffled=[...opts].sort(()=>Math.random()-.5);$('choices').replaceChildren();shuffled.forEach(n=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=format(n);b.addEventListener('click',()=>{if(locked)return;selected=n;soundSelect();document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c===b));$('confirm').disabled=false});$('choices').appendChild(b)});$('confirm').disabled=true;mission++;$('mission').textContent='🚀 Missão '+mission;$('planet').className='planet p'+(mission%4)}function check(){if(locked||selected===null)return;if(selected===answer){locked=true;score++;$('score').textContent=score;$('feedback').textContent='🌟 Excelente! A nave vai para outro planeta!';$('feedback').className='feedback correct';$('confirm').disabled=true;soundSuccess();celebrate();$('scene').classList.add('fly');timeout=setTimeout(make,1900)}else{errors++;soundWrong();$('errors').textContent=errors;$('feedback').textContent='🛸 Quase! Tenta novamente.';$('feedback').className='feedback wrong';selected=null;$('confirm').disabled=true;document.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'))}}$('confirm').addEventListener('click',check);$('new').addEventListener('click',()=>{soundLaunch();make()});$('level').addEventListener('change',make);$('kind').addEventListener('change',make);make()})();
</script></body></html>
