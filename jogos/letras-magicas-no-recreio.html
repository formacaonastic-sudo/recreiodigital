// Cache smooth centreline samples without repeatedly asking the SVG renderer
// to recalculate a long, self-crossing curve during a pupil's pointer movement.
function buildTraceGeometry(path){
  const tokens=path.match(/[MLC]|-?\d+(?:\.\d+)?/g)||[];
  const points=[];let i=0,position={x:0,y:0},distance=0;
  const add=(p,move=false)=>{
    if(points.length&&!move)distance+=Math.hypot(p.x-position.x,p.y-position.y);
    points.push({length:distance,point:p});position=p;
  };
  while(i<tokens.length){
    const command=tokens[i++];
    if(command==='M')add({x:Number(tokens[i++]),y:Number(tokens[i++])},true);
    else if(command==='L')add({x:Number(tokens[i++]),y:Number(tokens[i++])});
    else if(command==='C'){
      const a=position,b={x:Number(tokens[i++]),y:Number(tokens[i++])},
        c={x:Number(tokens[i++]),y:Number(tokens[i++])},d={x:Number(tokens[i++]),y:Number(tokens[i++])};
      for(let k=1;k<=64;k++){
        const t=k/64,v=1-t;
        add({x:v*v*v*a.x+3*v*v*t*b.x+3*v*t*t*c.x+t*t*t*d.x,
             y:v*v*v*a.y+3*v*v*t*b.y+3*v*t*t*c.y+t*t*t*d.y});
      }
    }else throw Error('Traçado desconhecido');
  }
  const scale=len/distance;
  geometryPoints=points.map(p=>({length:p.length*scale,point:p.point}));
}

// Fit the complete letter, including its wide outline and any dot, to the
// writing area instead of reserving the empty margins of the source model.
function fitLetterToWritingArea(config){
  let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
  for(const sample of geometryPoints){
    const p=sample.point;
    left=Math.min(left,p.x);right=Math.max(right,p.x);
    top=Math.min(top,p.y);bottom=Math.max(bottom,p.y);
  }
  const halfStroke=29;
  left-=halfStroke;right+=halfStroke;top-=halfStroke;bottom+=halfStroke;
  if(config.dot){
    const d=config.dot;
    left=Math.min(left,d.x-d.r);right=Math.max(right,d.x+d.r);
    top=Math.min(top,d.y-d.r);bottom=Math.max(bottom,d.y+d.r);
  }
  const margin=16;
  svg.setAttribute('viewBox',`${left-margin} ${top-margin} ${right-left+margin*2} ${bottom-top+margin*2}`);
}

function at(length){
  length=Math.max(0,Math.min(len,length));
  let low=0,high=geometryPoints.length-1;
  while(low<high){const mid=Math.ceil((low+high)/2);if(geometryPoints[mid].length<=length)low=mid;else high=mid-1}
  const a=geometryPoints[low],b=geometryPoints[Math.min(low+1,geometryPoints.length-1)];
  const ratio=b.length>a.length?(length-a.length)/(b.length-a.length):0;
  return {x:a.point.x+(b.point.x-a.point.x)*ratio,y:a.point.y+(b.point.y-a.point.y)*ratio};
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pos(e){

}
function tone(freq=650){
  if(!sound)return;
  try{
    audioCtx??=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.10,audioCtx.currentTime+.015);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.17);
  }catch{}
}

// Speak in European Portuguese, using the available device voice.
function speakText(text,onFinished){
  if(!sound||!text)return false;
  const synth=window.speechSynthesis;
  if(!synth||typeof window.SpeechSynthesisUtterance!=='function')return false;
  try{
    synth.cancel();
    const message=new window.SpeechSynthesisUtterance(text);
    message.lang='pt-PT';message.rate=.9;message.pitch=1.08;message.volume=1;
    const voices=synth.getVoices();
    const portuguese=voices.filter(v=>String(v.lang).replace('_','-').toLowerCase()==='pt-pt');
    const voice=portuguese.find(v=>v.localService)||portuguese[0];
    if(voice)message.voice=voice;
    let notified=false;
    const finishSpeaking=()=>{if(notified)return;notified=true;if(typeof onFinished==='function')onFinished()};
    message.onend=finishSpeaking;message.onerror=finishSpeaking;
    synth.speak(message);
    return true;
  }catch{return false}
}
function stopSpeech(){
  pendingSpeech='';
  try{window.speechSynthesis?.cancel()}catch{}
}
function instructionForSpeech(){
  if(done)return lastEncouragement;
  return hint.textContent.replace(/^[\s\d·👆👀⭐🌟✨]+/u,'').trim();
}
function queueSpeech(text){pendingSpeech=sound?text:''}
function flushSpeech(){
  const text=pendingSpeech;pendingSpeech='';
  if(!text)return;
  if(done&&text===lastEncouragement){playCompletionAudio();return}
  if(!speakText(text))tone(784);
}

const LETTER_PRACTICE_ORDER=["a","A","e","E","i","I","o","O","u","U","p","P","t","T","l","L","d","D","m","M","v","V","c","C","n","N","r","R","b","B","g","G","s","S","j","J","f","F","z","Z","h","H","x","X","q","Q","k","K","w","W","y","Y"];

function scheduleAutoAdvance(delay){
  cancelAutoAdvance();if(!done)return;
  const run=completionRun;
  autoLetterTimer=setTimeout(()=>{
    autoLetterTimer=0;
    if(done&&completionRun===run)advanceToNextLetter();
  },delay);
}
function advanceToNextLetter(){
  if(!done)return;
  const index=LETTER_PRACTICE_ORDER.indexOf(letter);
  const next=LETTER_PRACTICE_ORDER[(index+1)%LETTER_PRACTICE_ORDER.length];
  selectLetter(next,true);
}
function playCompletionAudio(){
  if(!done){speakText(lastEncouragement);return}
  const run=++completionRun;
  // Always continue, including when a device does not report speech ending.
  scheduleAutoAdvance(11000);
  const started=speakText(lastEncouragement,()=>{
    if(done&&completionRun===run){
      scheduleAutoAdvance(Math.max(800,2400-(Date.now()-successStartedAt)));
    }
  });
  if(!started){
    tone(784);
    scheduleAutoAdvance(Math.max(800,2800-(Date.now()-successStartedAt)));
  }
}

function makeArrows(){

  const ratios=LETTERS[letter].arrowRatios?.[phaseIndex]||(letter==='p'?[.24,.58,.85]:[.19,.39,.61,.84]);
  for(const ratio of ratios){
    const length=phase.start+(phase.end-phase.start)*ratio;
    const p=at(length),q=at(Math.min(phase.end,length+3));
    const a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    const el=document.createElementNS(NS,'path');
    el.setAttribute('d',LETTERS[letter].hints?'M -8 -5 L 2 0 L -8 5 Z':'M -10 -6 L 2 0 L -10 6 Z');
    el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${a})`);

function draw(){

    stroke.el.style.strokeDashoffset=stroke.length-local;

  const p=at(progress);tip.setAttribute('cx',p.x);tip.setAttribute('cy',p.y);
  const showPhaseStart=LETTERS[letter].liftBefore?.includes(phaseIndex)&&progress<phases[phaseIndex].start+20;
  start.style.opacity=progress<20||showPhaseStart?1:0;
  hint.style.opacity=LETTERS[letter].hints||progress<30?1:0;
}
function stop(){dragging=false;activePointer=null;lastPointer=null}
function finish(){

    hint.textContent=`👆 Toca no ponto do ${letter} para terminar!`;hint.style.opacity=1;
    dotGuide.style.opacity=1;queueSpeech(`Agora toca no ponto do ${LETTERS[letter].dotSpokenName||letter}.`);return;
  }
  done=true;stop();successStartedAt=Date.now();completionRun++;scheduleAutoAdvance(3200);tip.style.opacity=0;arrows.style.opacity=0;guide.style.opacity=0;
  const encouragements=['Muito bem! Conseguiste!','Fantástico! Continua assim!','Excelente! Muito bem!'];
  lastEncouragement=encouragements[encouragementIndex++%encouragements.length];

function nextPhase(){
  if(phaseIndex+1<phases.length){
    phaseIndex++;

      stop();progress=phases[phaseIndex].start+.05;
      const first=at(progress);start.setAttribute('cx',first.x);start.setAttribute('cy',first.y);
      draw();
    }
    setHint();makeArrows();
    if(LETTERS[letter].liftBefore?.includes(phaseIndex))queueSpeech(instructionForSpeech());

function advance(e){
  if(!dragging||done||e.pointerId!==activePointer)return;
  const p=pos(e),movement=lastPointer?dist(p,lastPointer):0;
  if(movement<.05)return;

  // Never jump over a reversal of direction, even at a crossing of the stem.
  const max=Math.min(phase.end,progress+Math.min(90,Math.max(28,movement*1.7+8)));
  let best=progress,bestDist=dist(p,at(progress));
  for(let index=Math.ceil((progress+1)/2);index<tracePoints.length&&tracePoints[index].length<=max;index++){
    const sample=tracePoints[index];
    const distance=dist(p,sample.point);
    if(distance<bestDist){bestDist=distance;best=sample.length}
  }
  const endDistance=dist(p,at(max));
  if(endDistance<bestDist){bestDist=endDistance;best=max}
  const tolerance=assisted?42:29;
  if(bestDist<tolerance&&best>progress){
    progress=best;draw();
    if(phase.end-progress<6&&dist(p,phase.endPoint)<tolerance){

    }

svg.addEventListener('pointerdown',e=>{

    if(LETTERS[letter].dot&&dist(p,targetDot)<targetDot.r+11){

    }

function reset(){

function selectLetter(next,readInitial=false){
  if(!LETTERS[next])return;

  svg.setAttribute('aria-label',`Letra ${letter} manuscrita: segue o tracejado preto dentro do contorno.`);

  const rows=config.rows||(letter==='p'?[
    {y:52,stroke:'#a9d9f7',width:2},

    {y:477,stroke:'#a9d9f7',width:2}
  ]:defaultRows);
  notebookLines.forEach((line,i)=>{
    const row=rows[i];line.setAttribute('y1',row.y);line.setAttribute('y2',row.y);

  });

  buildTraceGeometry(config.path);

  multiPaint.replaceChildren();strokePaints=[];

  for(const path of config.strokes||[]){
    const el=document.createElementNS(NS,'path');el.setAttribute('d',path);el.setAttribute('class','written');
    multiPaint.appendChild(el);const length=el.getTotalLength();
    el.style.strokeDasharray=`${length} ${length}`;el.style.strokeDashoffset=length;

    const first=at(progress);start.setAttribute('cx',first.x);start.setAttribute('cy',first.y);

function updateLetterPicture(key){
  const lower=key.toLowerCase(),item=LETTER_PICTURES[lower];if(!item)return;
  const image=document.getElementById('pictureImage');image.src=item.image;image.alt=item.word;
  document.getElementById('picturePair').textContent=`${lower} ${lower.toUpperCase()}`;
  document.getElementById('pictureWord').textContent=item.word;
  document.getElementById('pictureCue').setAttribute('aria-label',`Ouvir a palavra ${item.word}`);
}
document.getElementById('pictureCue').addEventListener('click',()=>{
  if(done){playCompletionAudio();return}
  const item=LETTER_PICTURES[letter.toLowerCase()];if(item)speakText(item.word+'.');
});

const LETTER_GROUPS=[
  {id:'vowels',letters:'aeiou'},
  {id:'consonants',letters:'ptldmvcnrbgsjfzhxqkwy'}
];
let currentGroup='vowels',letterPage=0;
function pagePairCount(){return window.innerWidth&&window.innerWidth<460?2:3}
function groupForLetter(key){return LETTER_GROUPS.find(g=>g.letters.includes(key.toLowerCase()))}
function updateLetterSelector(){
  const group=LETTER_GROUPS.find(g=>g.id===currentGroup);
  const count=pagePairCount(),pages=Math.ceil(group.letters.length/count);
  letterPage=Math.max(0,Math.min(pages-1,letterPage));
  const visible=group.letters.slice(letterPage*count,(letterPage+1)*count);
  for(const g of LETTER_GROUPS)document.getElementById(g.id+'Bank').setAttribute('aria-pressed',g.id===currentGroup);
  for(const key of Object.keys(LETTERS))document.getElementById(LETTERS[key].buttonId||'choose'+key.toUpperCase()).hidden=!visible.includes(key.toLowerCase());
  document.getElementById('letterPrev').disabled=letterPage===0;
  document.getElementById('letterNext').disabled=letterPage===pages-1;
  document.getElementById('pageStatus').textContent=pages>1?`${letterPage+1} / ${pages}`:'';
}
function revealLetterInSelector(key){
  const group=groupForLetter(key);if(!group)return;
  currentGroup=group.id;letterPage=Math.floor(group.letters.indexOf(key.toLowerCase())/pagePairCount());
  updateLetterSelector();
}
function showLetterBank(bank,switchLetter=true){
  if(['first','middle','last'].includes(bank))bank='consonants';
  const group=LETTER_GROUPS.find(g=>g.id===bank);if(!group)return;
  const changed=currentGroup!==bank;currentGroup=bank;if(changed)letterPage=0;
  updateLetterSelector();
  if(switchLetter&&!group.letters.includes(letter.toLowerCase()))selectLetter(group.letters[0],true);
  else if(switchLetter){if(done)playCompletionAudio();else speakText(instructionForSpeech())}
}
for(const group of LETTER_GROUPS)document.getElementById(group.id+'Bank').addEventListener('click',()=>showLetterBank(group.id));
document.getElementById('letterPrev').addEventListener('click',()=>{letterPage--;updateLetterSelector()});
document.getElementById('letterNext').addEventListener('click',()=>{letterPage++;updateLetterSelector()});
if(typeof window.addEventListener==='function')window.addEventListener('resize',()=>revealLetterInSelector(letter));
selectLetter('a');
