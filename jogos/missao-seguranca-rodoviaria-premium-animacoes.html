function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}function sound(ok){if(mute)return;try{
 audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();
 const now=audio.currentTime+.012,seq=ok?[[523.25,0,.13],[659.25,.105,.13],[783.99,.21,.13],[1046.5,.33,.27]]:[[392,0,.14],[311.13,.17,.23]];
 seq.forEach(([hz,delay,duration])=>{const osc=audio.createOscillator(),gain=audio.createGain(),t=now+delay;
 osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(hz,t);if(!ok)osc.frequency.exponentialRampToValueAtTime(hz*.93,t+duration);
 osc.connect(gain);gain.connect(audio.destination);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(ok?.085:.042,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.start(t);osc.stop(t+duration+.025)})
 }catch(e){}}

function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function intro(){clearTimeout(timer);$('back').href=`../${year}-ano/`;$('app').innerHTML=`<section class="intro"><div style="font-size:62px">🚸 🚦 🚲</div><h2>A tua aventura começa aqui!</h2><p>Explora a cidade, descobre os sinais portugueses e toma decisões seguras! Escolhe o teu ano e prepara-te para a missão.</p><div class="years">${[1,2,3,4].map(y=>`<button class="${year===y?'sel':''}" data-year="${y}">${y}.º ano</button>`).join('')}</div><div class="mode mission-modes" style="justify-content:center"><button data-mode="sinais" class="${mode==='sinais'?'active':''}">🚦 Descobrir sinais</button><button data-mode="seguranca" class="${mode==='seguranca'?'active':''}">🚸 Segurança rodoviária</button><button data-mode="misto" class="${mode==='misto'?'active':''}">🏆 Desafio misto</button><button data-mode="cidade" class="${mode==='cidade'?'active':''}">🏙️ Cidade interativa</button></div><p style="font-size:15px">${mode==='cidade'?'5 missões com decisões na estrada':'10 desafios por ronda'} · Feedback imediato · Medalha no final - Desenvolvido por Sara Menezes</p><button class="btn green" id="start" style="font-size:21px;padding:15px 30px">🚀 Iniciar missão</button></section>`;document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{year=+b.dataset.year;intro()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;intro()});$('start').onclick=start;}
// Rodas de perguntas independentes por ano e modo. O progresso fica guardado neste navegador.
function drawQuestions(pool,count){
 const key='recreio-rodoviaria-v2-'+year+'-'+mode;
 const byId=new Map(pool.map(q=>[q.uid,q]));
 let saved={remaining:[],last:[]};
 try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Array.isArray(x.remaining)&&Array.isArray(x.last))saved=x}catch(e){}
 let remaining=saved.remaining.filter((id,i,a)=>byId.has(id)&&a.indexOf(id)===i);
 const selected=[];
 while(selected.length<Math.min(count,pool.length)){
   if(!remaining.length){
     // Novo ciclo apenas depois de esgotar todas as perguntas do ciclo anterior.
     remaining=shuffle([...byId.keys()]);
     // Evita, quando possível, repetir imediatamente a última pergunta do ciclo anterior.
     if(remaining.length>1&&remaining[0]===saved.last.at(-1))remaining.push(remaining.shift());
   }
   const id=remaining.shift();
   if(!selected.includes(id))selected.push(id);
   else if(!remaining.length)break;
 }
 saved.remaining=remaining;saved.last=selected;
 try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}
 return selected.map(id=>byId.get(id));
}
function start(){
 if(mode==='cidade'){startCity();return}
 let pool=[];
 if(mode!=='seguranca')pool.push(...S.filter(x=>x.min<=year).map(x=>({...x,type:'sign',uid:'s:'+x.id})));
 if(mode!=='sinais')pool.push(...situations.map((x,i)=>({...x,type:'situation',uid:'p:'+i})).filter(x=>x.min<=year));
 questions=drawQuestions(pool,10).map(x=>({...x,options:shuffle([x.meaning||x.a,...(x.wrong||x.w)])}));
 index=correct=wrong=0;render();
}
function render(){clearTimeout(timer);locked=false;if(index>=questions.length){end();return}let q=questions[index];$('app').innerHTML=`<div class="hud"><div class="pill">🎒 ${year}.º ano</div><div class="pill">Desafio <b>${index+1}/${questions.length}</b></div><div class="pill">⭐ Acertos: <b>${correct}</b></div><div class="pill">💡 A rever: <b>${wrong}</b></div><button class="btn" id="mute" style="padding:8px 12px">${mute?'🔇':'🔊'} Som</button></div><div class="progress"><div style="width:${100*index/questions.length}%"></div></div><div class="stage" style="margin-top:15px"><div class="signarea">${q.type==='sign'?signSVG(q):`<div style="font-size:110px;position:relative;z-index:1">${q.emoji}</div>`}<div class="signcaption">${q.type==='sign'?'👀 Observa bem este sinal':'🛡️ A segurança começa contigo'}</div></div><div><div class="question">${q.type==='sign'?'O que significa este sinal?':q.q}</div><div class="answers">${q.options.map((x,i)=>`<button class="answer" style="--i:${i}" data-i="${i}"><span style="opacity:.6">${['A','B','C','D'][i]}.</span> ${x}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite">🦉 Observa o sinal, pensa com atenção e escolhe a melhor resposta.</div><div class="controls"><button class="btn orange" id="menu">⌂ Escolher modo</button><button class="btn green" id="next" disabled>Próximo desafio →</button></div></div></div>`;$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇 Som':'🔊 Som'};$('menu').onclick=intro;$('next').onclick=()=>{index++;render()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));}

function rdBurst(element,success=true){
 if(!element||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=element.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;
 const glyphs=success?['⭐','✨','🌟','💛','✨']:['💡','✨','💙'];
 for(let k=0;k<(success?15:6);k++){
  const e=document.createElement('span');e.className='rd-spark';e.textContent=glyphs[k%glyphs.length];
  const angle=(Math.PI*2*k/(success?15:6))+(Math.random()-.5)*.35;
  const dist=45+Math.random()*(success?105:55);
  e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--dx',Math.cos(angle)*dist+'px');
  e.style.setProperty('--dy',Math.sin(angle)*dist-25+'px');e.style.setProperty('--rot',Math.round(Math.random()*240-120)+'deg');
  document.body.appendChild(e);e.addEventListener('animationend',()=>e.remove(),{once:true});setTimeout(()=>e.remove(),1100);
 }
}

function answer(i){if(locked)return;locked=true;let q=questions[index],ans=q.meaning||q.a,chosen=q.options[i],ok=chosen===ans;ok?correct++:wrong++;rdBurst(document.querySelectorAll('.answer')[i],ok);sound(ok);if(ok)confetti();document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(q.options[j]===ans)b.classList.add('good');else if(j===i)b.classList.add('bad')});let f=$('feedback');f.className='feedback '+(ok?'ok':'no');f.innerHTML=`<span class="fb-symbol">${ok?'🏆':'💡'}</span><span><strong>${ok?'Resposta certa! Excelente decisão.':'Boa tentativa! Vamos aprender.'}</strong><small>${!ok?'Resposta correta: '+escapeHTML(ans)+'. ':''}${escapeHTML(q.tip)}</small></span>`;$('next').disabled=false;timer=setTimeout(()=>{index++;render()},ok?2600:4100)}
function end(){let p=Math.round(correct/questions.length*100),medal=p>=90?'🏆 Guardião da Estrada':p>=70?'🥇 Explorador Rodoviário':p>=50?'🥈 Amigo da Segurança':'🌱 Aprendiz Rodoviário';$('app').innerHTML=`<div class="end"><div style="font-size:72px">${p>=70?'🏆':'🚦'}</div><h2>Missão concluída!</h2><h2 style="color:#1269b4">${medal}</h2><p>⭐ Acertaste em <b>${correct}</b> de <b>${questions.length}</b> desafios.</p><p>${p>=70?'Excelente! Continua a praticar a segurança rodoviária.':'Cada tentativa ajuda a aprender. Vamos tentar outra vez?'}</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn green" id="again">🔄 Jogar novamente</button><button class="btn orange" id="menu">⌂ Escolher modo</button></div></div>`;$('again').onclick=start;$('menu').onclick=intro;if(p>=70)confetti()}

function renderCity(){clearTimeout(timer);if(cityIndex>=cityMissions.length){endCity();return}cityLocked=false;let m=cityMissions[cityIndex];$('app').innerHTML=`<div class="hud"><div class="pill">🏙️ Cidade segura</div><div class="pill">🎒 ${year}.º ano</div><div class="pill">🗺️ Missão <b>${cityIndex+1}/5</b></div><div class="pill">⭐ Estrelas <b>${cityScore}</b></div><button class="btn" id="cityMenu">⌂ Menu</button></div><div class="progress"><div style="width:${cityIndex*20}%"></div></div><div class="city-layout"><div class="city-map" role="img" aria-label="Cidade ilustrada com escola, passadeira, automóvel e semáforo"><div class="owl-guide">🦉</div><div class="status">${m.light==='red'?'🔴 Esperar':'🟢 Atenção'}</div><div class="cloud">☁️</div><div class="school">🏫</div><div class="trees">🌳🌲</div><div class="road"></div><div class="zebra">${'<span></span>'.repeat(5)}</div><div class="car" id="cityCar">🚙</div><div class="walker" id="cityWalker">${m.scene}</div><div class="light"><div class="bulb red ${m.light==='red'?'on':''}"></div><div class="bulb green ${m.light==='green'?'on':''}"></div></div></div><div class="city-panel"><div class="city-tag">${m.tag}</div><h2>${m.title}</h2><p>${m.prompt}</p><div class="city-actions">${m.choices.map((c,i)=>`<button data-city="${i}">${['A','B','C'][i]}. ${c}</button>`).join('')}</div><div id="cityFeedback" class="city-feedback" aria-live="polite">🦉 Qual será a decisão mais segura? Estou a contar contigo!</div><button class="city-next" id="cityNext" disabled>Próxima missão →</button></div></div>`;$('cityMenu').onclick=intro;$('cityNext').onclick=()=>{cityIndex++;renderCity()};document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>cityAnswer(+b.dataset.city));}
function cityAnswer(i){if(cityLocked)return;cityLocked=true;let m=cityMissions[cityIndex],ok=i===m.right;rdBurst(document.querySelectorAll('[data-city]')[i],ok);if(ok){cityScore++;confetti();sound(true);if(m.light==='green')$('cityWalker').classList.add('crossed');else $('cityCar').classList.add('moving')}else sound(false);document.querySelectorAll('[data-city]').forEach(b=>{b.disabled=true;if(+b.dataset.city===m.right)b.classList.add('good');else if(+b.dataset.city===i)b.classList.add('bad')});let f=$('cityFeedback');f.className='city-feedback '+(ok?'ok':'no');f.innerHTML=`<span class="fb-symbol">${ok?'🌟':'💡'}</span><span><strong>${ok?'Muito bem! Decisão segura.':'Vamos aprender com esta situação!'}</strong><small>${!ok?'A opção mais segura é: '+escapeHTML(m.choices[m.right])+'. ':''}${escapeHTML(m.tip)}</small></span>`;$('cityNext').disabled=false;timer=setTimeout(()=>{cityIndex++;renderCity()},ok?2700:4500);}
function endCity(){let medal=cityScore===5?'🏆 Guardião da Cidade':cityScore>=3?'🥇 Amigo da Estrada':'🌱 Aprendiz da Segurança';$('app').innerHTML=`<div class="end"><div style="font-size:80px">🏫🦉🚦</div><h2>Chegaste à escola em segurança!</h2><h2>${medal}</h2><p>⭐ Tomaste <b>${cityScore}</b> decisões seguras em 5 missões.</p><p>O mais importante é aprender a proteger-te e a respeitar os outros na estrada.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn green" id="again">🔄 Repetir aventura</button><button class="btn orange" id="menu">⌂ Escolher modo</button></div></div>`;$('again').onclick=startCity;$('menu').onclick=intro;if(cityScore>=3)confetti()}

intro();
</script></body></html>
