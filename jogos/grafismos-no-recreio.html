 byId('counter').textContent='⭐ '+completed;byId('counter').setAttribute('aria-label',`${completed} grafismos concluídos`);byId('progressFill').style.width=`${progress/p.length*100}%`;
 byId('markers').style.opacity=done?0:1;if(done)return;
 const tip=p.at(progress),end=p.at(p.length);for(const el of [penDot,startRing]){el.setAttribute('cx',tip.x);el.setAttribute('cy',tip.y)}
 startRing.style.opacity=demoActive?.4:1;goal.setAttribute('transform',`translate(${end.x} ${end.y}) scale(1.4)`);goal.style.opacity=distance(p.at(0),end)<32&&progress<p.length*.78?0:1;
}
function finishPattern(){
 stop();completed++;done=true;progress=pattern.length;byId('successText').textContent='Conseguiste!';celebrate.classList.add('show');celebrate.setAttribute('aria-hidden','false');setInstruction();draw();scheduleNext();
}
function advance(e){
 if(!dragging||done||demoActive||e.pointerId!==activePointer)return;
 const b=position(e),a=lastPointer||b,movement=distance(a,b);
 if(movement<.08)return;
 lastPointer=b;
 const p=pattern,tolerance=assisted?25:17;
 // Percorre o movimento em passos pequenos para não perder curvas apertadas,
 // cruzamentos ou mudanças de direção nos grafismos ligados.
 const steps=Math.max(1,Math.ceil(movement/5));
 let next=progress;
 for(let step=1;step<=steps;step++){
  const q={x:a.x+(b.x-a.x)*step/steps,y:a.y+(b.y-a.y)*step/steps};
  // Só se pode avançar no segmento seguinte do percurso (até 30 unidades).
  // A procura local evita saltos para outro ramo nos pontos de cruzamento.
  const limit=Math.min(p.length,next+30);
  let best=next,bestDist=distance(q,p.at(next));
  for(let l=next+2;l<=limit;l+=2){
   const d=distance(q,p.at(l));
   if(d<bestDist){bestDist=d;best=l}
  }
  if(bestDist<=tolerance&&best>next)next=best;
 }
 if(next>progress){
  progress=Math.min(p.length,next);
  // A extremidade final pode ficar entre amostras de 2 unidades.
  if(p.length-progress<=3&&distance(b,p.at(p.length))<=tolerance)progress=p.length;
  draw();
  if(progress>=p.length-.01)finishPattern();
 }
}
svg.addEventListener('pointerdown',e=>{if(done||demoActive||dragging||(e.pointerType==='mouse'&&e.button!==0))return;const p=position(e),target=pattern.at(progress);if(distance(p,target)>(assisted?37:27))return;dragging=true;activePointer=e.pointerId;lastPointer=p;svg.classList.add('is-dragging');try{svg.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!dragging)return;const samples=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[];for(const sample of samples.length?samples:[e]){if(dragging)advance(sample)}e.preventDefault()});
for(const type of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(type,e=>{if(activePointer===e.pointerId)stop()});
function stopDemo(restore=true){const wasActive=demoActive;demoActive=false;cancelAnimationFrame(demoFrame);clearTimeout(demoTimer);byId('demo').textContent='▶ Ver como se faz';if(wasActive&&restore){progress=demoSavedProgress;setInstruction();makeArrows();draw()}}
function playDemo(){
 if(done)return;if(demoActive){stopDemo();return}stop();demoSavedProgress=progress;progress=0;demoActive=true;byId('demo').textContent='■ Parar';instruction.textContent='👀 Observa o movimento da bolinha.';const p=pattern,duration=Math.max(2000,Math.min(10000,p.length*8));let begin=null;const run=sceneRun;
 const tick=now=>{if(!demoActive||sceneRun!==run)return;begin??=now;progress=p.length*Math.min(1,(now-begin)/duration);draw();if(progress<p.length){demoFrame=requestAnimationFrame(tick);return}demoTimer=setTimeout(()=>{if(demoActive&&sceneRun===run)stopDemo()},1000)};demoFrame=requestAnimationFrame(tick);
}
function loadExercise(scene,exercise,key=null){
 const item=SCENES[scene]?.patterns[exercise];if(!item)return;
 sceneRun++;cancelNext();stopDemo(false);stop();sceneIndex=scene;patternIndex=exercise;currentKey=key??EXERCISES.findIndex(x=>x.scene===scene&&x.pattern===exercise);progress=0;done=false;
 art.innerHTML=SCENES[scene].art;byId('scenePreview').innerHTML=SCENES[scene].previewArt;traceLayer.replaceChildren();pattern=compilePath(item.d);
 pattern.outline=make('path',{d:item.d,class:'corridor-outline'});pattern.road=make('path',{d:item.d,class:'road is-active'});pattern.guide=make('path',{d:item.d,class:'guide is-active'});pattern.ink=make('path',{d:item.d,class:'ink','stroke-dasharray':`${pattern.length} ${pattern.length}`,'stroke-dashoffset':pattern.length});traceLayer.append(pattern.outline,pattern.road,pattern.guide,pattern.ink);
 byId('sceneTitle').textContent=item.label?'Grafismos ligados · '+item.label:SCENES[scene].title;byId('sceneTheme').textContent='Um percurso de cada vez · '+EXERCISES.length+' atividades';byId('sceneEmoji').textContent=SCENES[scene].emoji;svg.setAttribute('aria-label','Grafismo para seguir com o rato, do início ao fim.');
 celebrate.classList.remove('show');celebrate.setAttribute('aria-hidden','true');setInstruction();makeArrows();draw();
}
byId('restart').addEventListener('click',()=>loadExercise(sceneIndex,patternIndex,currentKey));byId('demo').addEventListener('click',playDemo);byId('assist').addEventListener('click',()=>{assisted=!assisted;byId('assist').setAttribute('aria-pressed',assisted);byId('assist').textContent=assisted?'🖐️ Com ajuda':'✏️ Mais precisão';draw()});
configureNavigation();nextExercise();

</script>
