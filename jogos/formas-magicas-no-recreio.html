board.append(create('rect',{x:8,y:12,width:180,height:754,rx:25,fill:'#fff7e7',stroke:'#f6cb80','stroke-width':5}));
board.append(create('rect',{x:1212,y:12,width:180,height:754,rx:25,fill:'#fff7e7',stroke:'#f6cb80','stroke-width':5}));
const targetLayer=create('g',{id:'target-layer'}),placedLayer=create('g',{id:'placed-layer'});board.append(targetLayer,placedLayer);
scene.pieces.forEach((p,i)=>{
 const t=geom(p,'target');t.dataset.slot=i;t.setAttribute('transform',goalTransform);t.setAttribute('aria-label','Local para encaixar uma peça');
 t.style.cursor='pointer';targetLayer.append(t);
 t.addEventListener('click',()=>{if(selected!==null&&!drag)place(selected,i)});
});
const ids=shuffle(scene.pieces.map((_,i)=>i));
const left=ids.slice(0,Math.ceil(n/2)),right=ids.slice(Math.ceil(n/2));
for(const [side,arr] of [[0,left],[1,right]]){
 const cellH=Math.min(215,720/arr.length);
 arr.forEach((id,pos)=>{
  const p=scene.pieces[id],boxX=side?1222:18,boxY=31+pos*(720/arr.length),cardH=720/arr.length-12;
  board.append(create('rect',{x:boxX,y:boxY,width:160,height:cardH,rx:20,fill:['#e3f1ff','#f8e9ff','#e2f8ec','#fff0dd'][pos%4],stroke:'#fff','stroke-width':4}));
  const scale=Math.min(145/p.w,(cardH-22)/p.h,2.5);
  const tx=boxX+(160-p.w*scale)/2-p.x*scale,ty=boxY+(cardH-p.h*scale)/2-p.y*scale;
  const g=create('g',{class:'draggable','data-id':id,role:'button','aria-label':'Peça geométrica',tabindex:'0'});
  const shape=geom(p,'piece');if(p.c==='white')shape.classList.add('white-piece');shape.setAttribute('fill',C[p.c]);g.append(shape);board.append(g);
  coords[id]={g,p,tx,ty,scale,done:false};
  g.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);
  g.addEventListener('pointerdown',start);g.addEventListener('click',()=>{if(!coords[id].done){selected=id;highlight(id)}});
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=id;highlight(id)}});
 });
}
update()}

function update(){let n=current.pieces.length;document.getElementById('level').textContent=`⭐ ${round}`;document.getElementById('counter').textContent=`🧩 ${placed.size} / ${n}`;document.getElementById('fill').style.width=(placed.size/n*100)+'%'}
function point(e){const p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=board.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
// Stable pointer dragging: the piece stays under the grab point, without resizing
// or jumping. Mouse, touch and stylus all use the same SVG coordinate system.
let selected=null;
function highlight(id){
 coords.forEach((c,i)=>{if(c&&!c.done)c.g.style.opacity=i===id?'1':'.55'});
}
function start(e){
 if(drag||e.button>0)return;
 const id=Number(e.currentTarget.dataset.id),c=coords[id];
 if(!c||c.done)return;
 e.preventDefault();e.stopPropagation();
 const pt=point(e);
 selected=id;highlight(id);
 // The shape's centre follows the pointer exactly, using the SAME scale as the target.
 // No cumulative translation errors from a differently scaled tray piece.
 const centerX=c.p.x+c.p.w/2,centerY=c.p.y+c.p.h/2;
 const x=pt.x-FIT*centerX,y=pt.y-FIT*centerY;
 drag={id,pointerId:e.pointerId,start:pt,moved:false};
 c.g.style.transition='none';
 c.g.setAttribute('transform',`translate(${x} ${y}) scale(${FIT})`);
 board.append(c.g);
 try{board.setPointerCapture(e.pointerId)}catch(_){}
}
function move(e){
 if(!drag||e.pointerId!==drag.pointerId)return;
 e.preventDefault();
 const pt=point(e),c=coords[drag.id];
 if(Math.hypot(pt.x-drag.start.x,pt.y-drag.start.y)>5)drag.moved=true;
 c.g.setAttribute('transform',`translate(${pt.x-FIT*(c.p.x+c.p.w/2)} ${pt.y-FIT*(c.p.y+c.p.h/2)}) scale(${FIT})`);
 const gx=SHIFT_X+FIT*(c.p.x+c.p.w/2),gy=SHIFT_Y+FIT*(c.p.y+c.p.h/2);
 const near=Math.hypot(pt.x-gx,pt.y-gy)<Math.max(100,Math.min(190,Math.max(c.p.w,c.p.h)*FIT*.65));
 if(near){
   if(!magnet){magnet=geom(c.p,'magnet');magnet.setAttribute('transform',goalTransform);magnet.style.pointerEvents='none';board.append(magnet);}
   c.g.style.opacity='.76';
 }else{if(magnet){magnet.remove();magnet=null;}c.g.style.opacity='1';}
}

let praiseIndex=0;
function showPraise(){
 const stage=document.querySelector('.stage');const el=document.createElement('div');
 el.className='piece-praise';el.textContent=['⭐','✨','💖','🌟','🎉'][praiseIndex++%5];
 stage.append(el);setTimeout(()=>el.remove(),850);
}
function victoryTune(){if(muted)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const notes=[523.25,659.25,783.99,1046.5];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.115;o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.23)})}catch(e){}}
function victoryShow(){
 document.getElementById('win-icon').textContent=['🏆','🌟','🥇','💎','👑'][(round-1)%5];
 victoryTune();celebrate();document.getElementById('overlay').classList.add('show');
 autoNext=setTimeout(()=>build(true),2600);
}
function snapSparkle(p){
 // Animação pequena no encaixe, sem tapar o desenho nem bloquear o rato.
 const x=SHIFT_X+FIT*(p.x+p.w/2),y=SHIFT_Y+FIT*(p.y+p.h/2);
 const group=create('g',{class:'snap-burst','pointer-events':'none'});
 const ring=create('circle',{cx:x,cy:y,r:26,fill:'none',stroke:'#fff6a6','stroke-width':7});
 group.append(ring);
 for(let i=0;i<8;i++){
   const a=i*Math.PI/4,dist=45;
   group.append(create('circle',{cx:x+Math.cos(a)*dist,cy:y+Math.sin(a)*dist,r:i%2?5:7,fill:i%2?'#ffffff':'#ffe76b'}));
 }
 board.append(group);setTimeout(()=>group.remove(),700);
}
function place(id,slot){
 const placedLayer=board.querySelector('#placed-layer');
 const c=coords[id];if(!c||c.done||id!==slot)return false;
 c.done=true;placed.add(id);c.g.remove();
 const target=board.querySelector(`[data-slot="${id}"]`);
 const correct=geom(c.p,'placed');if(c.p.c==='white')correct.classList.add('white-piece');correct.setAttribute('fill',C[c.p.c]);correct.setAttribute('transform',goalTransform);
 if(target)target.remove();
 correct.dataset.placedId=id;
 const following=[...placedLayer.children].find(el=>Number(el.dataset.placedId)>id);
 if(following)placedLayer.insertBefore(correct,following);else placedLayer.append(correct);
 // Tiny highlights give every finished geometric tile a polished, toy-like finish.
 const shine=geom(c.p,'placed');shine.setAttribute('transform',goalTransform);
 shine.setAttribute('fill','none');shine.setAttribute('stroke','#ffffff');
 shine.setAttribute('stroke-opacity','.48');shine.setAttribute('stroke-width','2.5');
 shine.style.pointerEvents='none';shine.dataset.placedId=id;
 const after=[...placedLayer.children].find(el=>Number(el.dataset.placedId)>id);
 if(after)placedLayer.insertBefore(shine,after);else placedLayer.append(shine);

 selected=null;coords.forEach(x=>{if(x)x.g.style.opacity='1'});
 beep();update();snapSparkle(c.p);
 if(placed.size===coords.length)setTimeout(()=>{decorateFinished();victoryShow()},550);else showPraise();
 return true;
}
function finish(e,cancelled=false){
 if(!drag||e.pointerId!==drag.pointerId)return;
 e.preventDefault();
 const d=drag,c=coords[d.id],pt=point(e);
 try{if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId)}catch(_){}
 drag=null;
 if(magnet){magnet.remove();magnet=null;}c.g.style.opacity="1";
 const gx=SHIFT_X+FIT*(c.p.x+c.p.w/2),gy=SHIFT_Y+FIT*(c.p.y+c.p.h/2);
 // Pointer and shape centre are aligned during the entire drag.
 const tolerance=Math.max(100,Math.min(190,Math.max(c.p.w,c.p.h)*FIT*.65));
 if(!cancelled&&Math.hypot(pt.x-gx,pt.y-gy)<tolerance){
   place(d.id,d.id);
 }else{
   c.g.style.transition='transform .2s ease-out';
   c.g.setAttribute('transform',`translate(${c.tx} ${c.ty}) scale(${c.scale})`);
   setTimeout(()=>c.g.style.transition='',220);
   if(d.moved&&!cancelled)beep(false);
 }
}

board.addEventListener('pointermove',move,{passive:false});
board.addEventListener('pointerup',e=>finish(e),{passive:false});
board.addEventListener('pointercancel',e=>finish(e,true));
window.addEventListener('blur',()=>{if(drag){const c=coords[drag.id];c.g.setAttribute('transform',`translate(${c.tx} ${c.ty}) scale(${c.scale})`);drag=null}});

function celebrate(){for(let i=0;i<85;i++){let d=document.createElement('span');d.className='confetti';d.style.left=(Math.random()*100)+'vw';d.style.top='-20px';d.style.background=['#ffcf4a','#ff6480','#50cda1','#5da4ff','#a78bfa','#ffffff'][i%6];d.style.animationDelay=(Math.random()*.7)+'s';d.style.animationDuration=(1.5+Math.random())+'s';document.body.append(d);setTimeout(()=>d.remove(),3000)}}
document.getElementById('help').onclick=()=>{
 const pending=coords.map((c,i)=>c&&!c.done?i:null).filter(i=>i!==null);
 if(!pending.length)return;
 const id=selected!==null&&!coords[selected].done?selected:pending[Math.floor(Math.random()*pending.length)];
 const target=board.querySelector(`[data-slot="${id}"]`);
 if(!target)return;
 target.classList.remove('hint-pulse');void target.getBoundingClientRect();target.classList.add('hint-pulse');
 beep();clearTimeout(hintTimer);hintTimer=setTimeout(()=>target.classList.remove('hint-pulse'),1800);
};
document.getElementById('next').onclick=()=>build(true);document.getElementById('reset').onclick=()=>build(true);document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇':'🔊'};build(true);
</script></body></html>
