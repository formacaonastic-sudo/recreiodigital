<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrasta as Cores — Recreio Digital</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:linear-gradient(140deg,#eaf6ff,#fff7de);color:#173153}header{background:#143e73;color:white;text-align:center;padding:15px 10px}.brand{font-weight:900;font-size:clamp(19px,3vw,25px);margin:0 0 7px;text-align:left;padding-left:clamp(8px,2vw,24px)}.brand-line{width:min(440px,85%);border:0;border-top:1px solid #ffffff55;margin:7px auto 10px}h1{margin:0;font-size:clamp(23px,4vw,36px)}header p{margin:5px 0 0}main{max-width:1000px;margin:auto;padding:12px}.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px}.nav a,.nav button{border:0;border-radius:12px;padding:10px 13px;background:#ffbc3e;color:#173153;font-weight:800;text-decoration:none;cursor:pointer;font-size:14px}.nav button{background:#d4f1fa}.score{text-align:center;font-size:19px;font-weight:800;margin:7px 0 12px}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bin{min-height:160px;border:5px dashed #ffffffa8;border-radius:22px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 6px 0 #0002;transition:transform .15s}.bin strong{font-size:clamp(14px,2.5vw,24px)}.placed{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;min-height:35px}.placed svg{width:29px;height:29px}.bin[data-color=azul]{background:#2476e5;color:white}.bin[data-color=vermelho]{background:#e34242;color:white}.bin[data-color=amarelo]{background:#f5c630;color:#443109}.bin.over{transform:scale(1.035);outline:4px solid #2dc77d}.tray{background:white;border-radius:20px;padding:12px;margin-top:15px;box-shadow:0 8px 25px #19395720}h2{text-align:center;font-size:18px;margin:2px 0 12px}.objects{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;min-height:176px}.obj{height:83px;border:3px solid #c7d7e9;background:#f5faff;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #a8bed5}.obj svg{width:65px;height:65px;pointer-events:none}.obj.dragging{opacity:.35}.obj:focus-visible{outline:4px solid #ff8c28}.ghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-50%);width:83px;height:83px;display:grid;place-items:center;background:white;border:3px solid #2d8ed4;border-radius:18px;box-shadow:0 8px 30px #0004}.ghost svg{width:69px;height:69px}#msg{text-align:center;min-height:34px;font-size:20px;font-weight:800;margin-top:9px}.ok{color:#13834e}.bad{color:#b83737}footer{text-align:center;padding:13px;color:#184679;font-weight:800}.fruit{position:fixed;top:-65px;z-index:100;pointer-events:none;font-size:35px;animation:fall var(--duration) linear forwards;left:var(--left)}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(650deg);opacity:.95}}.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#143e7366;pointer-events:none}.celebrate{background:white;border:6px solid #ffbe38;border-radius:26px;padding:26px 30px;text-align:center;box-shadow:0 12px 35px #0004;max-width:90vw}.celebrate strong{display:block;font-size:clamp(23px,5vw,38px);color:#16834c}.celebrate p{font-size:20px;font-weight:700;margin-bottom:0}@media(max-width:550px){.bin{min-height:126px;border-radius:14px}.objects{gap:6px}.obj{height:65px;border-radius:11px}.obj svg{width:48px;height:48px}.placed svg{width:21px;height:21px}.nav a,.nav button{font-size:12px;padding:8px}.tray{padding:8px}h2{font-size:15px}}
</style></head><body><header><div class="brand">🦉 Recreio Digital</div><hr class="brand-line"><h1>🎨 Arrasta as Cores</h1><p>Arrasta cada objeto para a caixa da sua cor!</p></header><main><div class="nav"><a id="back" href="../pre-escolar/index.html">← Voltar aos jogos</a><a href="../index.html">🏠 Página inicial</a><button id="sound" type="button">🔊 Som ligado</button></div><div class="score" id="score">Nível 1 · Objetos: 0 / 10</div><div class="bins"><div class="bin" data-color="azul"><strong>🔵 AZUL</strong><div class="placed"></div></div><div class="bin" data-color="vermelho"><strong>🔴 VERMELHO</strong><div class="placed"></div></div><div class="bin" data-color="amarelo"><strong>🟡 AMARELO</strong><div class="placed"></div></div></div><section class="tray"><h2>🖱️ Clica, arrasta e larga!</h2><div class="objects" id="objects"></div><div id="msg" role="status" aria-live="polite"></div></section></main><footer>Feito com ❤️ para aprender e brincar · Recreio Digital</footer><script>
'use strict';
const q=new URLSearchParams(location.search);document.querySelector('#back').href=q.get('ano')==='1'?'../1-ano/index.html':'../pre-escolar/index.html';
const $=s=>document.querySelector(s), palette={azul:'#1875e8',vermelho:'#e9333b',amarelo:'#f5c400'},colorNames=Object.keys(palette);
let sound=true,level=1,done=0,locked=false,active=null,ghost=null,nextTimer=null,seq=0;
// Desenhos vetoriais com cores explícitas, iguais em todos os computadores.
const designs=['bola','estrela','coração','flor','balão','carro','peixe','borboleta','maçã','casa','copo','chapéu','papagaio','barco','presente','rebuçado','sol','camisola','lápis','guarda-chuva','foguete','comboio','folha','diamante'];
function drawing(kind,color){const c=palette[color],dark='#26394c',green='#278c52';let s='';switch(kind){
case 'bola':s=`<circle cx="50" cy="50" r="32" fill="${c}"/><path d="M30 28Q50 50 30 72M70 28Q50 50 70 72M18 50H82" fill="none" stroke="white" stroke-width="3"/>`;break;
case 'estrela':s=`<path d="M50 12L60 37 88 38 66 56 74 84 50 68 26 84 34 56 12 38 40 37Z" fill="${c}"/>`;break;
case 'coração':s=`<path d="M50 84C29 65 12 52 12 35 12 12 39 11 50 30 61 11 88 12 88 35 88 52 71 65 50 84Z" fill="${c}"/>`;break;
case 'flor':s=`${[0,60,120,180,240,300].map(a=>`<ellipse cx="50" cy="29" rx="13" ry="20" fill="${c}" transform="rotate(${a} 50 50)"/>`).join('')}<circle cx="50" cy="50" r="13" fill="${c}" stroke="white" stroke-width="3"/>`;break;
case 'balão':s=`<ellipse cx="50" cy="38" rx="27" ry="31" fill="${c}"/><path d="M45 68L50 75 55 68M50 75Q36 88 50 96" stroke="${dark}" stroke-width="3" fill="none"/>`;break;
case 'carro':s=`<path d="M12 44H23L34 26H69L80 44H89V72H12Z" fill="${c}"/><rect x="37" y="31" width="27" height="14" rx="3" fill="#e9f5ff"/><circle cx="29" cy="73" r="9" fill="${dark}"/><circle cx="73" cy="73" r="9" fill="${dark}"/>`;break;
case 'peixe':s=`<ellipse cx="47" cy="50" rx="30" ry="22" fill="${c}"/><path d="M69 50L93 27V73Z" fill="${c}"/><circle cx="32" cy="45" r="4" fill="white"/><circle cx="33" cy="45" r="2" fill="${dark}"/>`;break;
case 'borboleta':s=`<ellipse cx="30" cy="31" rx="20" ry="24" fill="${c}"/><ellipse cx="70" cy="31" rx="20" ry="24" fill="${c}"/><ellipse cx="32" cy="69" rx="17" ry="20" fill="${c}"/><ellipse cx="68" cy="69" rx="17" ry="20" fill="${c}"/><path d="M50 27Q39 8 32 12M50 27Q61 8 68 12" fill="none" stroke="${dark}" stroke-width="2"/><ellipse cx="50" cy="52" rx="6" ry="27" fill="${dark}"/>`;break;
case 'maçã':s=`<path d="M50 30C18 10 7 45 22 71 33 94 45 83 50 83 55 83 67 94 78 71 93 45 82 10 50 30Z" fill="${c}"/><path d="M50 28L53 13" stroke="${dark}" stroke-width="5"/><path d="M53 21Q68 9 73 20Q65 29 53 21Z" fill="${green}"/>`;break;
case 'casa':s=`<path d="M13 47L50 15 87 47Z" fill="${c}"/><rect x="21" y="45" width="58" height="42" rx="3" fill="${c}"/><rect x="42" y="59" width="17" height="28" fill="white"/><rect x="27" y="53" width="11" height="11" fill="white"/>`;break;
case 'copo':s=`<path d="M23 20H77L69 86H31Z" fill="${c}"/><path d="M31 31H69" stroke="white" stroke-width="4"/>`;break;
case 'chapéu':s=`<path d="M28 64L39 25H61L72 64Z" fill="${c}"/><ellipse cx="50" cy="67" rx="42" ry="10" fill="${c}"/><path d="M31 56H69" stroke="white" stroke-width="4"/>`;break;
case 'papagaio':s=`<path d="M50 8L83 45 50 79 17 45Z" fill="${c}"/><path d="M50 79Q60 90 48 97" fill="none" stroke="${dark}" stroke-width="3"/><path d="M50 8V79M17 45H83" stroke="white" stroke-width="2"/>`;break;
case 'barco':s=`<path d="M10 62H90L76 84H27Z" fill="${c}"/><path d="M49 15V62M46 20L17 57H46Z" fill="${c}" stroke="white" stroke-width="2"/><path d="M54 24L79 57H54Z" fill="${c}" stroke="white" stroke-width="2"/>`;break;
case 'presente':s=`<rect x="17" y="35" width="66" height="49" rx="4" fill="${c}"/><rect x="12" y="29" width="76" height="13" rx="3" fill="${c}"/><path d="M50 30V84M18 48H82" stroke="white" stroke-width="5"/><path d="M50 29C23 29 30 7 43 15L50 29C77 29 70 7 57 15Z" fill="${c}" stroke="white" stroke-width="2"/>`;break;
case 'rebuçado':s=`<rect x="27" y="32" width="46" height="37" rx="17" fill="${c}"/><path d="M27 39L8 29 12 70 27 61ZM73 39L92 29 88 70 73 61Z" fill="${c}"/><path d="M38 40L62 60" stroke="white" stroke-width="4"/>`;break;
case 'sol':s=`${Array.from({length:12},(_,i)=>`<path d="M50 6V19" stroke="${c}" stroke-width="6" stroke-linecap="round" transform="rotate(${i*30} 50 50)"/>`).join('')}<circle cx="50" cy="50" r="26" fill="${c}"/>`;break;
case 'camisola':s=`<path d="M33 18L20 24 8 48 26 58 32 47V84H68V47L74 58 92 48 80 24 67 18 58 27H42Z" fill="${c}"/>`;break;
case 'lápis':s=`<path d="M31 77L21 91 24 72 69 17 83 29Z" fill="${c}"/><path d="M21 91L24 72 36 82Z" fill="#d2a878"/><path d="M67 20L78 9 91 21 80 32Z" fill="${c}"/>`;break;
case 'guarda-chuva':s=`<path d="M12 49Q18 12 50 12Q82 12 88 49Q78 39 69 49Q60 39 50 49Q40 39 31 49Q22 39 12 49Z" fill="${c}"/><path d="M50 49V78Q50 92 39 84" stroke="${dark}" stroke-width="5" fill="none"/>`;break;
case 'foguete':s=`<path d="M50 9Q76 30 66 72H34Q24 30 50 9Z" fill="${c}"/><circle cx="50" cy="43" r="11" fill="white"/><path d="M34 59L18 78 34 75M66 59L82 78 66 75" fill="${c}"/>`;break;
case 'comboio':s=`<rect x="21" y="17" width="58" height="64" rx="13" fill="${c}"/><rect x="29" y="26" width="42" height="26" rx="4" fill="white"/><circle cx="34" cy="68" r="6" fill="${dark}"/><circle cx="66" cy="68" r="6" fill="${dark}"/>`;break;
case 'folha':s=`<path d="M13 78Q18 13 88 15Q89 79 13 78Z" fill="${c}"/><path d="M15 82L75 29" stroke="white" stroke-width="4"/>`;break;
case 'diamante':s=`<path d="M25 25H75L94 45 50 88 6 45Z" fill="${c}"/><path d="M25 25L36 45 50 88 64 45 75 25M6 45H94" fill="none" stroke="white" stroke-width="2"/>`;break;
}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let queue=[];function nextDesign(){if(!queue.length)queue=shuffle([...designs]);return queue.pop()}
function beep(good){if(!sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=good?660:220;gain.gain.setValueAtTime(.075,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.2);osc.onended=()=>ctx.close()}catch(e){}}
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Som ligado':'🔇 Som desligado'};
function update(){$('#score').textContent=`Nível ${level} · Objetos colocados: ${done} / 10`}
function newRound(){locked=false;done=0;$('#msg').textContent='';$('#msg').className='';document.querySelectorAll('.placed').forEach(x=>x.replaceChildren());$('#objects').replaceChildren();const colors=shuffle(['azul','azul','azul','vermelho','vermelho','vermelho','vermelho','amarelo','amarelo','amarelo']);const arr=shuffle(colors.map(color=>({color,kind:nextDesign()})));arr.forEach((item,i)=>{const el=document.createElement('div');el.className='obj';el.innerHTML=drawing(item.kind,item.color);el.dataset.color=item.color;el.dataset.kind=item.kind;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`Objeto ${item.kind} de cor ${item.color}. Arrasta para a caixa ${item.color}.`);el.addEventListener('pointerdown',start);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const color=prompt('Qual é a cor deste objeto? azul, vermelho ou amarelo');if(color)drop(el,color.toLowerCase().trim())}});$('#objects').append(el)});update()}
function start(e){if(locked||active||e.button!==0)return;e.preventDefault();active=e.currentTarget;active.classList.add('dragging');ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=active.innerHTML;document.body.append(ghost);move(e);window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true});window.addEventListener('pointercancel',cancel,{once:true})}
function move(e){if(!ghost)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.bin').forEach(x=>x.classList.remove('over'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');if(target)target.classList.add('over')}
function end(e){if(!active)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bin');if(target)drop(active,target.dataset.color);cancel()}
function cancel(){window.removeEventListener('pointermove',move);if(active)active.classList.remove('dragging');if(ghost)ghost.remove();ghost=null;active=null;document.querySelectorAll('.bin').forEach(x=>x.classList.remove('over'))}
const praises=['Muito bem! ⭐','Excelente! 🌟','Boa! Continua! 👏','Fantástico! 😊','Acertaste! 🎉'];
function drop(el,color){if(locked||!el.isConnected)return;if(color===el.dataset.color){const placed=document.querySelector(`.bin[data-color="${color}"] .placed`);placed.insertAdjacentHTML('beforeend',drawing(el.dataset.kind,color));el.remove();done++;beep(true);$('#msg').textContent=praises[(done+level)%praises.length];$('#msg').className='ok';update();if(done===10)finish()}else{beep(false);$('#msg').textContent='Quase! Experimenta outra caixa. 😊';$('#msg').className='bad'}}
function finish(){locked=true;$('#msg').textContent='🎉 Parabéns! Completaste o nível!';const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="celebrate"><strong>🌟 Fantástico! 🌟</strong><p>Nível ${level} concluído!</p><p>🍎 🍋 🍓 🍇 🍊</p></div>`;document.body.append(ov);const fruits=['🍎','🍋','🍓','🍇','🍊','🍌','🍐','🍒'];for(let i=0;i<34;i++){const f=document.createElement('span');f.className='fruit';f.textContent=fruits[i%fruits.length];f.style.setProperty('--left',Math.random()*100+'vw');f.style.setProperty('--drift',(Math.random()*180-90)+'px');f.style.setProperty('--duration',(2+Math.random()*1.6)+'s');f.style.animationDelay=Math.random()*.6+'s';document.body.append(f);setTimeout(()=>f.remove(),4400)}nextTimer=setTimeout(()=>{ov.remove();level++;newRound()},3200)}
newRound();
</script></body></html>
