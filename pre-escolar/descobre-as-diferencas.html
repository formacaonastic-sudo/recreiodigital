<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descobre as Diferenças | Recreio Digital</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#17345b;background:linear-gradient(#e9f8ff,#fff9e8);min-height:100vh}.top{background:#073b78;color:#fff;padding:12px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:1000}.brand em{color:#ffd33d;font-style:normal}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{background:white;color:#073b78;text-decoration:none;padding:11px 15px;border-radius:14px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{text-align:center;background:linear-gradient(115deg,#1597ed,#8050df);color:#fff;padding:20px;border-radius:25px;box-shadow:0 7px 0 #d8e8f4}.hero h1{font-size:clamp(28px,5vw,46px);margin:5px}.hero p{margin:5px;font-weight:800}.panel{background:white;border:2px solid #e0eaf5;border-radius:25px;padding:18px;margin:20px auto;box-shadow:0 7px 0 #dce8f1}.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.btn{font:900 18px "Trebuchet MS",Arial;border:0;border-radius:15px;background:#ffd33d;color:#073b78;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #d4a500}.btn.secondary{background:#d9f0ff;box-shadow:0 4px 0 #add4e9}.btn:focus-visible,.links a:focus-visible{outline:4px solid #ff9d1c;outline-offset:3px}.status{text-align:center;font-size:22px;font-weight:900;min-height:38px;margin:15px 0}.help{text-align:center;color:#57708e;font-weight:800;margin:10px}footer{text-align:center;color:#57708e;padding:15px}@media(max-width:540px){.top{justify-content:center}.brand{font-size:21px}.wrap{padding:10px}.panel{padding:12px}.btn{font-size:16px;padding:11px}} .scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:960px;margin:auto}.scene{width:100%;aspect-ratio:1.15;background:#e9f8ff;border:5px solid #b8dffc;border-radius:22px;overflow:hidden;cursor:pointer;touch-action:manipulation}.scene svg{width:100%;height:100%;display:block}.scene:focus-visible{outline:4px solid #ff9d1c}.scene-label{text-align:center;font-weight:1000;font-size:19px;margin:5px}.marker{fill:none;stroke:#ff9d1c;stroke-width:5;pointer-events:none}.progress{text-align:center;font-weight:1000;font-size:23px;color:#16874c;margin:10px}@media(max-width:550px){.scenes{gap:5px}.scene{border-width:3px;border-radius:12px}.scene-label{font-size:15px}}</style><style>
/* Melhorias de acessibilidade e apresentação, mantendo a identidade do portal */
.hero{background:linear-gradient(120deg,#1597ed,#8050df);border:3px solid #ffffff70}.panel{max-width:1050px}.toolbar{margin-bottom:12px}.btn{min-height:50px;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.48;cursor:not-allowed}.levelbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px auto 20px;font-weight:900;color:#073b78}.levelbar progress{width:min(360px,75vw);height:18px;accent-color:#39c866}.feedback{min-height:42px;text-align:center;font-size:1.3rem;font-weight:900;color:#073b78}.spark{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.08)}}.level-picker{background:#edf6ff;border:2px solid #cde4f9;border-radius:14px;padding:10px 14px;font:900 17px 'Trebuchet MS',sans-serif;color:#073b78;max-width:100%}.help{text-align:center;font-weight:800}.hero p{line-height:1.45}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.toolbar .btn{padding:10px 12px;font-size:16px}.hero{padding:16px 10px}}
</style></head><body><header class="top"><div class="brand">🦉 Recreio Digital</div><nav class="links"><a href="index.html">⬅ Voltar ao Pré-escolar</a><a href="../index.html">🏠 Página inicial</a></nav></header><main class="wrap"><section class="hero"><h1>🔎 Descobre as Diferenças</h1><p>Olha para os dois desenhos e encontra 5 diferenças!</p></section><section class="panel"><div class="toolbar"><button class="btn secondary" id="hear">🔊 Ouvir</button><button class="btn" id="again">🔄 Recomeçar</button><button class="btn secondary" id="hint">💡 Ajuda</button><button class="btn secondary" id="next">➡️ Próximo nível</button></div><div class="levelbar"><label for="levelSelect">🎯 Nível</label><select class="level-picker" id="levelSelect" aria-label="Escolher nível"></select><progress id="levelProgress" value="1" max="24"></progress><span id="levelCount">1 / 24</span></div><div class="status" id="status" aria-live="polite"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="progress" id="progress"></div><div class="scenes"><div><div class="scene-label">🖼️ Desenho 1</div><div class="scene" id="left" role="button" tabindex="0" aria-label="Primeiro desenho"></div></div><div><div class="scene-label">🖼️ Desenho 2</div><div class="scene" id="right" role="button" tabindex="0" aria-label="Segundo desenho"></div></div></div><p class="help">👆 Toca no sítio onde encontras uma diferença, em qualquer desenho.</p></section></main><footer>Feito para aprender a brincar · Recreio Digital 💙</footer><script>function falar(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';u.rate=.84;u.pitch=1.05;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='pt-pt')||vs.find(v=>v.lang.toLowerCase().startsWith('pt'))||null;speechSynthesis.speak(u)}catch(e){}}function som(v=660){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=v;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.19);o.onended=()=>a.close()}catch(e){}}
const TOTAL=24,positions=[[72,92],[210,88],[355,92],[105,230],[253,232],[390,228]];
const themes=[['Jardim','#d9f5ff','#b6eb9c',['🌻','🦋','🐞','🌳','☁️','🍎']],['Quinta','#d6f1ff','#b4e2a2',['🐮','🐥','🌻','🚜','🌳','🐑']],['Praia','#bfeeff','#ffe2a1',['🏖️','🐚','🦀','⛵','☀️','🐠']],['Espaço','#182e73','#4751a1',['🚀','🪐','⭐','👽','🌙','🛸']],['Floresta','#d9f3ff','#8cce91',['🦊','🍄','🌲','🐿️','🦉','🌷']],['Festa','#fff1e8','#f7d2ed',['🎈','🎁','🎂','🎉','🧸','🍭']],['Mar','#c4eeff','#79c7ef',['🐬','🐠','🐙','🐢','🦀','🐚']],['Doces','#fff0df','#ffc5db',['🍓','🍉','🍩','🍪','🧁','🍭']],['Parque','#d8f3ff','#c6e99d',['🎠','⚽','🛝','🚲','🌳','🎈']],['Dinossauros','#e5f5d5','#acd58e',['🦖','🦕','🥚','🌴','🌋','☀️']],['Inverno','#d8f1ff','#e6f5ff',['⛄','❄️','🧤','🧣','🐧','🌲']],['Transportes','#e7f4ff','#d6e1c9',['🚗','🚒','🚂','🚁','🚌','🚲']]];
const alternatives=['🌈','🎀','🍀','💎','🌟','🎯','🎁','🌸','🪁','💖','🎨','🍋'];let level=0,found=new Set(),changes=[],finished=false,wrong=0;
const left=document.getElementById('left'),right=document.getElementById('right'),status=document.getElementById('status'),progress=document.getElementById('progress'),feedback=document.getElementById('feedback'),selector=document.getElementById('levelSelect'),nextBtn=document.getElementById('next');
for(let i=0;i<TOTAL;i++){let o=document.createElement('option');o.value=i;o.textContent='Nível '+(i+1);selector.append(o)}
function count(){return Math.min(6,3+Math.floor(level/8))}function theme(){return themes[level%themes.length]}function svg(side){let t=theme();let out=`<svg viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="460" height="340" fill="${t[1]}"/><path d="M0 285 Q120 250 240 280 T460 270 V340 H0Z" fill="${t[2]}"/>`;for(let i=0;i<6;i++){const [x,y]=positions[i],changed=side==='right'&&changes.includes(i),icon=changed?alternatives[(i+level)%alternatives.length]:t[3][i];out+=`<text x="${x}" y="${y}" font-size="${changed?56:62}" text-anchor="middle" dominant-baseline="middle">${icon}</text>`;if(found.has(i))out+=`<circle cx="${x}" cy="${y}" r="42" fill="none" stroke="#ffb900" stroke-width="9" stroke-dasharray="9 5"/>`}return out+'</svg>'}
function render(){left.innerHTML=svg('left');right.innerHTML=svg('right');progress.textContent='⭐ Diferenças encontradas: '+found.size+' / '+count();status.textContent=finished?'🎉 Parabéns! Descobriste tudo!':'🔎 '+theme()[0]+' · Nível '+(level+1)+' de '+TOTAL;selector.value=level;document.getElementById('levelProgress').value=level+1;document.getElementById('levelCount').textContent=(level+1)+' / '+TOTAL;nextBtn.disabled=!finished}
function start(){found=new Set();finished=false;wrong=0;feedback.textContent='';changes=[0,1,2,3,4,5].sort(()=>Math.random()-.5).slice(0,count());render()}
function tap(el,e){if(finished)return;const rect=el.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*460,y=(e.clientY-rect.top)/rect.height*340;let idx=-1,best=1e9;positions.forEach(([a,b],i)=>{const d=(x-a)**2+(y-b)**2;if(d<best){best=d;idx=i}});if(best>52**2||!changes.includes(idx)||found.has(idx)){wrong++;feedback.textContent='💛 Tenta outra vez!';som(300);return}found.add(idx);som(790);feedback.textContent='⭐ Muito bem!';if(found.size===count()){finished=true;feedback.textContent=wrong<=2?'⭐⭐⭐ Excelente atenção!':'⭐⭐ Muito bem!';render();falar('Parabéns! Encontraste todas as diferenças!');avancarAutomaticamente()}else{render();falar('Muito bem! Encontraste uma diferença!')}}
[left,right].forEach(el=>el.addEventListener('click',e=>tap(el,e)));let temporizadorAvanco=null;function avancarAutomaticamente(){clearTimeout(temporizadorAvanco);if(level<TOTAL-1){feedback.textContent+=' · ⏳ Próximo desafio em 3 segundos…';temporizadorAvanco=setTimeout(()=>go(level+1),3000)}else{feedback.textContent+=' · 🏆 Completaste todos os desafios!';falar('Parabéns! Completaste todos os desafios!')}}function go(n){clearTimeout(temporizadorAvanco);level=(n+TOTAL)%TOTAL;start();falar('Nível '+(level+1)+'. Procura as diferenças entre os dois desenhos.')}
selector.onchange=()=>go(Number(selector.value));nextBtn.onclick=()=>go(level+1);document.getElementById('again').onclick=()=>{clearTimeout(temporizadorAvanco);start();falar('Vamos procurar outra vez!')};document.getElementById('hear').onclick=()=>falar('Olha para os dois desenhos. Procura o que está diferente e toca nessa figura.');document.getElementById('hint').onclick=()=>{let i=changes.find(i=>!found.has(i));if(i===undefined)return;let [x,y]=positions[i];feedback.textContent='💡 Procura perto da estrela a piscar!';[left,right].forEach(el=>{const dot=document.createElement('div');dot.style.cssText=`position:absolute;left:${x/460*100}%;top:${y/340*100}%;width:70px;height:70px;border:5px dashed #ff9d1c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5`;el.style.position='relative';el.append(dot);setTimeout(()=>dot.remove(),1800)});falar('Olha com atenção para a zona assinalada.')};start();
</script></body></html>
