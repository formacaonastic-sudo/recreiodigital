<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vamos Contar! | Recreio Digital</title><style>
:root{--navy:#073b78;--blue:#1597ed;--yellow:#ffd33d;--green:#39c866;--purple:#8050df;--ink:#17345b}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:linear-gradient(145deg,#e8faff,#fffdf2 55%,#eef9ff);color:var(--ink);min-height:100vh}.top{background:var(--navy);color:#fff;padding:12px max(3%,calc((100% - 1180px)/2));display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{font-size:1.35rem;font-weight:1000;margin-right:auto}.owl{background:var(--yellow);border:3px solid white;border-radius:50%;padding:6px;margin-right:8px}.navbtn{background:white;color:var(--navy);border-radius:13px;padding:10px 15px;font-weight:900;text-decoration:none}.wrap{max-width:1080px;margin:25px auto;padding:0 16px}.intro{text-align:center}.intro h1{font-size:clamp(2rem,5vw,3.4rem);margin:6px 0;color:var(--navy)}.intro p{font-size:1.15rem;font-weight:800;margin:8px}.board{background:#fff;border:3px solid #e3edf8;border-radius:28px;box-shadow:0 12px 0 #dce9f5;padding:22px;max-width:900px;margin:20px auto}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.chip{background:#eef7ff;border-radius:15px;padding:10px 15px}.progress{height:13px;background:#e6eff9;border-radius:20px;overflow:hidden;margin:18px 0}.progress div{height:100%;width:0;background:linear-gradient(90deg,#38c968,#19a9ed);transition:width .3s}.question{text-align:center;font-size:clamp(1.35rem,3vw,2rem);font-weight:1000;margin:10px 0 14px}.objects{background:linear-gradient(135deg,#f7fcff,#fff8e9);border:2px dashed #b7d8ee;border-radius:25px;min-height:210px;padding:22px;display:flex;flex-wrap:wrap;gap:15px;align-items:center;justify-content:center}.object{font-size:clamp(2.7rem,7vw,4.4rem);line-height:1.2;filter:drop-shadow(0 5px 1px #0001);animation:pop .25s backwards}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px auto 10px;max-width:650px}.answer{font:1000 clamp(2rem,6vw,3rem) 'Trebuchet MS',Arial,sans-serif;border:3px solid #d6e6f4;border-radius:22px;background:#fff;box-shadow:0 6px 0 #cbdceb;color:var(--navy);min-height:100px;cursor:pointer;transition:transform .15s}.answer:hover:not(:disabled){transform:translateY(-4px);background:#fff8d7}.answer:disabled{cursor:default}.answer.correct{background:#d5f9d8;border-color:#34be67}.answer.wrong{background:#ffe1e1;border-color:#ff7474}.feedback{text-align:center;min-height:58px;font-size:1.3rem;font-weight:1000;margin-top:14px}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}.control{font:900 1rem 'Trebuchet MS',Arial,sans-serif;background:#eaf5ff;border:0;border-radius:13px;padding:13px 17px;color:var(--navy);cursor:pointer}.primary{background:var(--yellow)}.control:disabled{opacity:.45;cursor:default}.end{text-align:center;padding:35px 10px}.end h2{font-size:2.5rem;color:var(--navy)}.end .trophy{font-size:5rem}.hidden{display:none!important}@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@media(max-width:540px){.board{padding:14px}.objects{min-height:170px;padding:12px;gap:9px}.answer{min-height:80px}.top{justify-content:center}.logo{width:100%;text-align:center}}
</style></head><body><header class="top"><div class="logo"><span class="owl">🦉</span> Recreio Digital</div><a class="navbtn" href="index.html">⬅ Voltar aos jogos</a><a class="navbtn" href="../index.html">🏠 Página inicial</a></header><main class="wrap"><div class="intro"><h1>🔢 Vamos Contar!</h1><p>Conta os objetos e escolhe o número certo!</p></div><section class="board" aria-label="Jogo de contagem"><div id="play"><div class="stats"><span class="chip" id="level">⭐ Desafio 1 de 20</span><span class="chip" id="points">🏆 0 pontos</span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question">Quantos objetos consegues contar?</div><div class="objects" id="objects" aria-label="Objetos para contar"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="controls"><button class="control" id="sound" type="button">🔊 Som ligado</button><button class="control" id="repeat" type="button">🔁 Recomeçar</button><button class="control primary" id="next" type="button" disabled>Próximo ➜</button></div></div><div id="end" class="end hidden"><div class="trophy">🏆🎉</div><h2>Parabéns!</h2><p id="result"></p><button class="control primary" id="again" type="button">🔁 Jogar novamente</button><p><a class="navbtn" href="index.html">⬅ Voltar aos jogos</a></p></div></section></main><footer style="text-align:center;color:#57708e;padding:18px">Feito para aprender a brincar · Recreio Digital 💙</footer><script>
'use strict';
const themes=[['🍎','maçãs'],['🐠','peixinhos'],['⭐','estrelas'],['🦋','borboletas'],['🚗','carros'],['🍓','morangos'],['🐝','abelhas'],['🌸','flores'],['🐞','joaninhas'],['🎈','balões'],['🍌','bananas'],['🐢','tartarugas'],['🍪','bolachas'],['🦄','unicórnios'],['🐸','sapinhos'],['🧸','ursinhos'],['🍉','melancias'],['🦕','dinossauros'],['⚽','bolas'],['🐧','pinguins']];
const counts=[1,2,3,4,5,2,4,6,7,8,3,5,7,9,10,6,8,9,10,10];
let step=0,score=0,answered=false,soundOn=true,advanceTimer=null,audio=null;
const $=id=>document.getElementById(id);
function tone(freq,duration=0.12,delay=0){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.08,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+duration)}catch(e){}}
function options(n){const pool=new Set([n]);let d=1;while(pool.size<3){if(n-d>=1)pool.add(n-d);if(pool.size<3&&n+d<=10)pool.add(n+d);d++}return [...pool].sort(()=>Math.random()-.5)}
function render(){clearTimeout(advanceTimer);answered=false;const [emoji,label]=themes[step],n=counts[step];$('level').textContent=`⭐ Desafio ${step+1} de ${counts.length}`;$('points').textContent=`🏆 ${score} pontos`;$('bar').style.width=`${step/counts.length*100}%`;$('question').textContent=`Quantos ${label} estão aqui?`;$('objects').innerHTML='';for(let i=0;i<n;i++){let e=document.createElement('span');e.className='object';e.textContent=emoji;e.style.animationDelay=`${i*.04}s`;$('objects').appendChild(e)}$('objects').setAttribute('aria-label',`${n} ${label}`);$('answers').innerHTML='';options(n).forEach(value=>{let b=document.createElement('button');b.type='button';b.className='answer';b.textContent=value;b.setAttribute('aria-label',`Responder ${value}`);b.onclick=()=>choose(value,b);$('answers').appendChild(b)});$('feedback').textContent='👆 Toca no número certo!';$('next').disabled=true}
function choose(value,button){if(answered)return;const n=counts[step];if(value===n){answered=true;score+=10;button.classList.add('correct');$('feedback').textContent='🎉 Muito bem! Acertaste!';tone(523,.13);tone(659,.13,.14);tone(784,.18,.29);[...$('answers').children].forEach(b=>b.disabled=true);$('points').textContent=`🏆 ${score} pontos`;$('next').disabled=false;advanceTimer=setTimeout(next,1700)}else{button.classList.add('wrong');button.disabled=true;$('feedback').textContent='💛 Tenta outra vez! Conta com calma.';tone(220,.18)}}
function next(){if(!answered)return;clearTimeout(advanceTimer);step++;if(step===counts.length){$('play').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`Concluíste os 20 desafios e ganhaste ${score} pontos!`;}else render()}
function restart(){clearTimeout(advanceTimer);step=0;score=0;$('play').classList.remove('hidden');$('end').classList.add('hidden');render()}
$('next').onclick=next;$('repeat').onclick=restart;$('again').onclick=restart;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado'};render();
</script></body></html>
