<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labirintos Divertidos | Recreio Digital</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#17345b;background:linear-gradient(#e9f8ff,#fff9e8);min-height:100vh}.top{background:#073b78;color:#fff;padding:12px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:1000}.brand em{color:#ffd33d;font-style:normal}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{background:white;color:#073b78;text-decoration:none;padding:11px 15px;border-radius:14px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{text-align:center;background:linear-gradient(115deg,#1597ed,#8050df);color:#fff;padding:20px;border-radius:25px;box-shadow:0 7px 0 #d8e8f4}.hero h1{font-size:clamp(28px,5vw,46px);margin:5px}.hero p{margin:5px;font-weight:800}.panel{background:white;border:2px solid #e0eaf5;border-radius:25px;padding:18px;margin:20px auto;box-shadow:0 7px 0 #dce8f1}.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.btn{font:900 18px "Trebuchet MS",Arial;border:0;border-radius:15px;background:#ffd33d;color:#073b78;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #d4a500}.btn.secondary{background:#d9f0ff;box-shadow:0 4px 0 #add4e9}.btn:focus-visible,.links a:focus-visible{outline:4px solid #ff9d1c;outline-offset:3px}.status{text-align:center;font-size:22px;font-weight:900;min-height:38px;margin:15px 0}.help{text-align:center;color:#57708e;font-weight:800;margin:10px}footer{text-align:center;color:#57708e;padding:15px}@media(max-width:540px){.top{justify-content:center}.brand{font-size:21px}.wrap{padding:10px}.panel{padding:12px}.btn{font-size:16px;padding:11px}}#maze{display:grid;gap:3px;margin:18px auto;width:min(100%,590px);aspect-ratio:1;background:#073b78;border:8px solid #073b78;border-radius:18px;overflow:hidden;touch-action:manipulation}.cell{display:grid;place-items:center;border:0;padding:0;background:#f2f8ff;font-size:clamp(16px,4vw,34px);cursor:pointer;min-width:0;min-height:0;position:relative}.cell.wall{background:#2787ca;cursor:default}.cell.path{background:#fff0b2}.cell.current{background:#bdf3c9;box-shadow:inset 0 0 0 3px #39c866}.cell.end{background:#ffdf9a}.cell:focus-visible{outline:4px solid #ff9d1c;outline-offset:-4px}.arrows{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px;margin:15px}.arrows button{font-size:26px;background:#d9f0ff;border:0;border-radius:13px;min-height:50px;cursor:pointer;font-weight:900}.arrows .up{grid-column:2}.arrows .left{grid-column:1}.arrows .down{grid-column:2}.arrows .right{grid-column:3;grid-row:2}</style><style>
/* Melhorias de acessibilidade e apresentação, mantendo a identidade do portal */
.hero{background:linear-gradient(120deg,#1597ed,#8050df);border:3px solid #ffffff70}.panel{max-width:1050px}.toolbar{margin-bottom:12px}.btn{min-height:50px;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.48;cursor:not-allowed}.levelbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px auto 20px;font-weight:900;color:#073b78}.levelbar progress{width:min(360px,75vw);height:18px;accent-color:#39c866}.feedback{min-height:42px;text-align:center;font-size:1.3rem;font-weight:900;color:#073b78}.spark{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.08)}}.level-picker{background:#edf6ff;border:2px solid #cde4f9;border-radius:14px;padding:10px 14px;font:900 17px 'Trebuchet MS',sans-serif;color:#073b78;max-width:100%}.help{text-align:center;font-weight:800}.hero p{line-height:1.45}@media(max-width:600px){.wrap{padding:10px}.panel{padding:12px}.toolbar .btn{padding:10px 12px;font-size:16px}.hero{padding:16px 10px}}
</style></head><body><header class="top"><div class="brand">🦉 Recreio Digital</div><nav class="links"><a href="index.html">⬅ Voltar ao Pré-escolar</a><a href="../index.html">🏠 Página inicial</a></nav></header><main class="wrap"><section class="hero"><h1>🌀 Labirintos Divertidos</h1><p>Ajuda o animal a encontrar a sua casinha!</p></section><section class="panel"><div class="toolbar"><button class="btn secondary" id="hear">🔊 Ouvir</button><button class="btn" id="restart">🔄 Recomeçar</button><button class="btn secondary" id="hint">💡 Ajuda</button><button class="btn secondary" id="next">➡️ Próximo nível</button></div><div class="levelbar"><label for="levelSelect">🎯 Nível</label><select class="level-picker" id="levelSelect" aria-label="Escolher nível"></select><progress id="levelProgress" value="1" max="24"></progress><span id="levelCount">1 / 24</span></div><div class="status" id="status" aria-live="polite"></div><div class="feedback" id="feedback" aria-live="polite"></div><div id="maze" aria-label="Labirinto interativo"></div><p class="help">👆 Toca nas casas ao lado do animal ou usa as setas do teclado.</p><div class="arrows" aria-label="Setas para movimentar"><button class="up" data-dir="-1,0" aria-label="Cima">⬆️</button><button class="left" data-dir="0,-1" aria-label="Esquerda">⬅️</button><button class="down" data-dir="1,0" aria-label="Baixo">⬇️</button><button class="right" data-dir="0,1" aria-label="Direita">➡️</button></div></section></main><footer>Feito para aprender a brincar · Recreio Digital 💙</footer><script>function falar(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-PT';u.rate=.84;u.pitch=1.05;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='pt-pt')||vs.find(v=>v.lang.toLowerCase().startsWith('pt'))||null;speechSynthesis.speak(u)}catch(e){}}function som(v=660){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=v;g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.19);o.onended=()=>a.close()}catch(e){}}
const TOTAL=24,animals=['🐰','🐻','🐱','🐼','🦊','🐸','🐶','🐨','🐭','🐯','🐵','🐧'],homes=['🥕','🍯','🐟','🎋','🏡','🌼','🦴','🌳','🧀','🏠','🍌','🐟'];
let level=0,grid=[],size=0,cur=[1,1],goal=[1,1],won=false,trail=new Set(),steps=0,shortest=0,solution=[];
const board=document.getElementById('maze'),status=document.getElementById('status'),feedback=document.getElementById('feedback'),selector=document.getElementById('levelSelect'),nextBtn=document.getElementById('next');
for(let i=0;i<TOTAL;i++){let o=document.createElement('option');o.value=i;o.textContent='Nível '+(i+1);selector.append(o)}
function rand(n){return Math.floor(Math.random()*n)}
function pathToGoal(){const queue=[[1,1]],seen=new Set(['1,1']),prev={};let at=0;while(at<queue.length){const [r,c]=queue[at++];if(r===goal[0]&&c===goal[1])break;for(const [dr,dc] of [[1,0],[0,1],[-1,0],[0,-1]]){let nr=r+dr,nc=c+dc,k=nr+','+nc;if(nr>=0&&nc>=0&&nr<size&&nc<size&&!grid[nr][nc]&&!seen.has(k)){seen.add(k);prev[k]=[r,c];queue.push([nr,nc])}}}let p=[...goal],a=[p];while(p[0]!==1||p[1]!==1){p=prev[p.join(',')];if(!p)return [];a.push(p)}return a.reverse()}
function make(){size=Math.min(19,7+2*Math.floor(level/4));grid=Array.from({length:size},()=>Array(size).fill(1));const seen=new Set(['1,1']),stack=[[1,1]];grid[1][1]=0;while(stack.length){const [r,c]=stack[stack.length-1],opts=[[r-2,c],[r+2,c],[r,c-2],[r,c+2]].filter(([a,b])=>a>0&&b>0&&a<size-1&&b<size-1&&!seen.has(a+','+b));if(!opts.length){stack.pop();continue}const [nr,nc]=opts[rand(opts.length)];grid[(r+nr)/2][(c+nc)/2]=0;grid[nr][nc]=0;seen.add(nr+','+nc);stack.push([nr,nc])}goal=[size-2,size-2];solution=pathToGoal();shortest=solution.length-1;cur=[1,1];steps=0;won=false;trail=new Set(['1,1']);feedback.textContent='';status.textContent='🐾 Ajuda o animal a chegar ao destino!';selector.value=level;document.getElementById('levelProgress').value=level+1;document.getElementById('levelCount').textContent=(level+1)+' / '+TOTAL;nextBtn.disabled=true;draw()}
function draw(){board.innerHTML='';board.style.gridTemplateColumns=`repeat(${size},1fr)`;board.style.maxWidth='min(95vw,620px)';board.style.margin='auto';for(let r=0;r<size;r++)for(let c=0;c<size;c++){const b=document.createElement('button');b.type='button';b.className='cell'+(grid[r][c]?' wall':'')+(trail.has(r+','+c)?' path':'')+(r===goal[0]&&c===goal[1]?' end':'')+(r===cur[0]&&c===cur[1]?' current':'');b.disabled=!!grid[r][c]||won;b.setAttribute('aria-label',`Linha ${r+1}, coluna ${c+1}`);if(r===cur[0]&&c===cur[1])b.textContent=animals[level%animals.length];else if(r===goal[0]&&c===goal[1])b.textContent=homes[level%homes.length];b.onclick=()=>move(r-cur[0],c-cur[1]);board.appendChild(b)}}
function move(dr,dc){if(won||Math.abs(dr)+Math.abs(dc)!==1)return;const r=cur[0]+dr,c=cur[1]+dc;if(r<0||c<0||r>=size||c>=size||grid[r][c]){som(230);return}cur=[r,c];steps++;trail.add(r+','+c);if(r===goal[0]&&c===goal[1]){won=true;nextBtn.disabled=false;status.textContent='🎉 Parabéns! Conseguiste!';feedback.textContent=steps<=shortest+3?'⭐⭐⭐ Caminho fantástico!':'⭐⭐ Muito bem!';som(900);falar('Parabéns! Encontraste o caminho!');avancarAutomaticamente()}else feedback.textContent='👣 Passos: '+steps;draw()}
let temporizadorAvanco=null;function avancarAutomaticamente(){clearTimeout(temporizadorAvanco);if(level<TOTAL-1){feedback.textContent+=' · ⏳ Próximo labirinto em 3 segundos…';temporizadorAvanco=setTimeout(()=>go(level+1),3000)}else{feedback.textContent+=' · 🏆 Completaste todos os labirintos!';falar('Parabéns! Completaste todos os labirintos!')}}function go(n){clearTimeout(temporizadorAvanco);level=(n+TOTAL)%TOTAL;make();falar('Nível '+(level+1)+'. Ajuda o animal a chegar ao destino.')}
selector.onchange=()=>go(Number(selector.value));nextBtn.onclick=()=>go(level+1);document.getElementById('restart').onclick=()=>{clearTimeout(temporizadorAvanco);make();falar('Vamos tentar novamente!')};document.getElementById('hear').onclick=()=>falar('Ajuda o animal a chegar ao seu destino. Usa as setas ou toca nas casas ao lado do animal.');document.getElementById('hint').onclick=()=>{let start=cur.join(','),q=[[...cur]],seen=new Set([start]),prev={},at=0,target=goal.join(',');while(at<q.length){let [r,c]=q[at++];if(r+','+c===target)break;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let nr=r+dr,nc=c+dc,k=nr+','+nc;if(nr>=0&&nc>=0&&nr<size&&nc<size&&!grid[nr][nc]&&!seen.has(k)){seen.add(k);prev[k]=[r,c];q.push([nr,nc])}}}let p=[...goal];while(prev[p.join(',')]&&prev[p.join(',')].join(',')!==start)p=prev[p.join(',')];const [dr,dc]=[p[0]-cur[0],p[1]-cur[1]];let word=dr===1?'baixo':dr===-1?'cima':dc===1?'direita':'esquerda';feedback.textContent='💡 Experimenta ir para '+word+'!';falar('Experimenta ir para '+word)};
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const [a,c]=b.dataset.dir.split(',').map(Number);move(a,c)});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}});make();
</script></body></html>
