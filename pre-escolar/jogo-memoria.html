<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo da Memória | Recreio Digital</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#e9f8ff,#fff9e8);color:#17345b;min-height:100vh}.top{background:#073b78;color:white;padding:12px 4%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{font-size:24px;font-weight:1000}.brand span{color:#ffd33d}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{background:#fff;color:#073b78;padding:10px 15px;border-radius:14px;font-weight:900;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{text-align:center;background:linear-gradient(110deg,#1597ed,#8050df);color:white;padding:22px;border-radius:26px;box-shadow:0 8px 0 #d7e7f7}.hero h1{font-size:clamp(28px,5vw,48px);margin:5px}.hero p{margin:6px;font-weight:bold}.panel{background:white;border:2px solid #e0eaf5;border-radius:25px;padding:18px;margin:20px auto;box-shadow:0 7px 0 #dce8f1}.toolbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.btn{font:900 18px 'Trebuchet MS',Arial;border:0;border-radius:15px;background:#ffd33d;color:#073b78;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #d4a500}.btn:active{transform:translateY(2px)}.btn.secondary{background:#ccecff;box-shadow:0 4px 0 #9dcbe8}.stats{font-size:19px;font-weight:900;text-align:center;margin:12px}.msg{min-height:34px;text-align:center;font-weight:900;color:#127d47;font-size:22px;margin:12px}select{padding:11px;border:2px solid #9bbde0;border-radius:12px;font-size:17px}footer{text-align:center;color:#57708e;padding:16px}@media(max-width:550px){.top{justify-content:center}.brand{font-size:21px}.wrap{padding:12px}.panel{padding:12px}}#hear{background:#ffd33d;color:#073b78}.tile{touch-action:manipulation}</style><style>.memory{display:grid;grid-template-columns:repeat(4,minmax(0,125px));gap:12px;justify-content:center;margin:18px auto}.tile{aspect-ratio:1;border:3px solid #d6e9fb;border-radius:18px;background:linear-gradient(135deg,#1597ed,#8050df);font-size:clamp(30px,6vw,55px);cursor:pointer;display:grid;place-items:center;transition:transform .2s;user-select:none;color:#fff}.tile.open,.tile.done{background:#fff8db;border-color:#ffc82e}.tile.done{background:#d5f8de;border-color:#39c866}.tile:focus-visible{outline:4px solid #ff9d1c}@media(max-width:480px){.memory{gap:7px}.tile{border-radius:12px}}</style></head><body><header class="top"><div class="brand">🦉 Recreio Digital</div><nav class="links"><a href="index.html">⬅ Voltar ao Pré-escolar</a><a href="../index.html">🏠 Página inicial</a></nav></header><main class="wrap"><section class="hero"><h1>🧠 Jogo da Memória</h1><p>Vira os cartões e encontra os pares iguais!</p></section><section class="panel"><div class="toolbar"><label><b>Dificuldade:</b> <select id="level"><option value="4">Fácil · 4 pares</option><option value="6">Médio · 6 pares</option><option value="8">Difícil · 8 pares</option></select></label><button class="btn" id="new">🔄 Novo jogo</button><button class="btn secondary" id="hear" type="button">🔊 Ouvir instruções</button> <button class="btn secondary" id="sound">🔊 Som ligado</button></div><div class="stats" id="stats"></div><div class="memory" id="board" aria-label="Cartões do jogo da memória"></div><div class="msg" id="msg" aria-live="polite"></div></section></main><footer>Feito para aprender a brincar · Recreio Digital 💙</footer><script>
/* Instruções orais: utiliza a voz portuguesa disponível no dispositivo. */
window.falarCrianca=function(frase){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(frase);u.lang='pt-PT';u.rate=.82;u.pitch=1.12;
 const vozes=speechSynthesis.getVoices();
 const pt=vozes.find(v=>v.lang.toLowerCase()==='pt-pt')||vozes.find(v=>v.lang.toLowerCase().startsWith('pt'));
 if(pt)u.voice=pt;
 speechSynthesis.speak(u);
};
</script>
<script>const icons=['🐶','🐱','🦋','🐸','🍎','🍌','🚗','🌞','🐼','🍓','🚀','🌈'];let cards=[],open=[],busy=false,moves=0,matched=0,soundOn=true,started=0;const board=document.getElementById('board'),msg=document.getElementById('msg');function beep(ok){if(!soundOn)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:270;g.gain.value=.045;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){const n=+document.getElementById('level').value;cards=shuffle([...icons.slice(0,n),...icons.slice(0,n)]).map((emoji,i)=>({emoji,i,done:false}));open=[];busy=false;moves=0;matched=0;started=Date.now();msg.textContent='Encontra os pares iguais!';render();falarCrianca('Vira dois cartões e encontra os desenhos iguais!')}function render(){board.innerHTML='';cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile'+(c.done?' done':open.includes(i)?' open':'');b.textContent=c.done||open.includes(i)?c.emoji:'❔';b.setAttribute('aria-label',c.done?'Par encontrado':open.includes(i)?c.emoji:'Virar cartão');b.disabled=c.done||open.includes(i)||busy;b.addEventListener('click',()=>flip(i));board.appendChild(b)});document.getElementById('stats').textContent=`⭐ Pares: ${matched}/${cards.length/2}   ·   🔄 Tentativas: ${moves}`}function flip(i){if(busy||cards[i].done||open.includes(i))return;open.push(i);beep(true);render();if(open.length===2){moves++;const [a,b]=open;if(cards[a].emoji===cards[b].emoji){cards[a].done=cards[b].done=true;matched++;open=[];msg.textContent='🎉 Muito bem! Encontraste um par!';beep(true);falarCrianca('Muito bem! Encontraste um par!');render();if(matched===cards.length/2){msg.textContent=`🏆 Parabéns! Completaste o jogo em ${moves} tentativas!`;falarCrianca('Parabéns! Encontraste todos os pares!')}}else{busy=true;msg.textContent='Experimenta outra vez!';render();setTimeout(()=>{open=[];busy=false;msg.textContent='Vamos encontrar os pares!';render()},900)}}}document.getElementById('hear').onclick=()=>falarCrianca('Vira dois cartões e encontra os desenhos iguais!');document.getElementById('new').onclick=start;document.getElementById('level').onchange=start;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado'};start();</script></body></html>
