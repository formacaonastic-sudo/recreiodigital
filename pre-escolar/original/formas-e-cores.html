<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Descobre as Formas e Cores | Aprende &amp; Brinca</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#e9f8ff,#fff9e8);color:#17345b;min-height:100vh}.top{background:#073b78;color:white;padding:12px 4%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{font-size:24px;font-weight:1000}.brand span{color:#ffd33d}.links{display:flex;gap:9px;flex-wrap:wrap}.links a{background:#fff;color:#073b78;padding:10px 15px;border-radius:14px;font-weight:900;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{text-align:center;background:linear-gradient(110deg,#1597ed,#8050df);color:white;padding:22px;border-radius:26px;box-shadow:0 8px 0 #d7e7f7}.hero h1{font-size:clamp(28px,5vw,48px);margin:5px}.hero p{margin:6px;font-weight:bold}.panel{background:white;border:2px solid #e0eaf5;border-radius:25px;padding:18px;margin:20px auto;box-shadow:0 7px 0 #dce8f1}.toolbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.btn{font:900 18px 'Trebuchet MS',Arial;border:0;border-radius:15px;background:#ffd33d;color:#073b78;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #d4a500}.btn:active{transform:translateY(2px)}.btn.secondary{background:#ccecff;box-shadow:0 4px 0 #9dcbe8}.stats{font-size:19px;font-weight:900;text-align:center;margin:12px}.msg{min-height:34px;text-align:center;font-weight:900;color:#127d47;font-size:22px;margin:12px}select{padding:11px;border:2px solid #9bbde0;border-radius:12px;font-size:17px}footer{text-align:center;color:#57708e;padding:16px}@media(max-width:550px){.top{justify-content:center}.brand{font-size:21px}.wrap{padding:12px}.panel{padding:12px}}.choice{min-height:155px;touch-action:manipulation}.choice span:last-child:not(.shape){display:none}#hear{background:#ffd33d;color:#073b78}</style><style>.question{text-align:center;font-size:clamp(23px,4vw,32px);font-weight:1000;margin:22px 0 14px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:760px;margin:0 auto}.choice{background:#f8fbff;border:4px solid #d7e9f7;border-radius:25px;min-height:170px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;color:#17345b;font:900 19px 'Trebuchet MS',Arial}.choice:hover{transform:translateY(-3px);border-color:#1597ed}.choice:disabled{opacity:.7;cursor:default}.choice.correct{background:#d7f9df;border-color:#39c866}.choice.wrong{background:#ffe0e0;border-color:#ef4d75}.shape{width:100px;height:100px;display:block;flex-shrink:0}.shape.circle{border-radius:50%}.shape.square{border-radius:9px}.shape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.shape.rectangle{width:120px;height:80px;border-radius:8px}.shape.diamond{transform:rotate(45deg);width:75px;height:75px;border-radius:6px;margin:12px}.shape.star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 71%,21% 91%,32% 57%,2% 35%,39% 35%)}@media(max-width:520px){.choices{gap:7px}.choice{min-height:130px;font-size:14px;padding:6px}.shape{width:65px;height:65px}.shape.rectangle{width:78px;height:55px}.shape.diamond{width:48px;height:48px}}</style></head><body><header class="top"><div class="brand">🦉 Aprende <span>&amp;</span> Brinca</div><nav class="links"><a href="index.html">⬅ Voltar ao Pré-escolar</a><a href="../index.html">🏠 Página inicial</a></nav></header><main class="wrap"><section class="hero"><h1>🌈 Descobre as Formas e Cores</h1><p>Aprende as formas geométricas e descobre as cores!</p></section><section class="panel"><div class="toolbar"><label><b>Tipo de desafio:</b> <select id="mode"><option value="mixed">Misturado</option><option value="shape">Descobrir formas</option><option value="color">Descobrir cores</option></select></label><button class="btn" id="new">🔄 Recomeçar</button><button class="btn secondary" id="hear" type="button">🔊 Ouvir pergunta</button> <button class="btn secondary" id="sound">🔊 Som ligado</button></div><div class="stats" id="stats"></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="msg" id="msg" aria-live="polite"></div></section></main><footer>🦉 Aprende &amp; Brinca · Jogos educativos</footer><script>
/* Instruções orais: utiliza a voz portuguesa disponível no dispositivo. */
window.falarCrianca=function(frase){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(frase);u.lang='pt-PT';u.rate=.82;u.pitch=1.12;
 const vozes=speechSynthesis.getVoices();
 const pt=vozes.find(v=>v.lang.toLowerCase()==='pt-pt')||vozes.find(v=>v.lang.toLowerCase().startsWith('pt'));
 if(pt)u.voice=pt;
 speechSynthesis.speak(u);
};
</script>
<script>const shapes=[['circle','círculo'],['square','quadrado'],['triangle','triângulo'],['rectangle','retângulo'],['diamond','losango'],['star','estrela']];const colors=[['#ef4d75','vermelho'],['#1597ed','azul'],['#39c866','verde'],['#ffd33d','amarelo'],['#8050df','roxo'],['#ff9d1c','laranja']];let step=0,score=0,locked=false,soundOn=true,question;const choices=document.getElementById('choices'),msg=document.getElementById('msg');function beep(ok){if(!soundOn)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:250;g.gain.value=.045;o.start();o.stop(c.currentTime+.14);o.onended=()=>c.close()}catch(e){}}function sample(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function next(){locked=false;choices.innerHTML='';if(step>=20){document.getElementById('question').textContent='🏆 Terminaste os 20 desafios!';falarCrianca('Parabéns! Terminaste os desafios!');msg.textContent=`🎉 Parabéns! Acertaste ${score} de 20!`;document.getElementById('stats').textContent='🌟 Jogo terminado';return}let mode=document.getElementById('mode').value;if(mode==='mixed')mode=step%2?'color':'shape';const shape=sample(shapes),color=sample(colors);const options=mode==='shape'?shuffle([shape,...shuffle(shapes.filter(s=>s!==shape)).slice(0,2)]):shuffle([color,...shuffle(colors.filter(c=>c!==color)).slice(0,2)]);question={mode,correct:mode==='shape'?shape[1]:color[1]};document.getElementById('question').textContent=mode==='shape'?`👀 Onde está o ${shape[1]}?`:`🎨 Qual é a cor ${color[1]}?`;options.forEach(item=>{const b=document.createElement('button');b.className='choice';const art=document.createElement('span');art.className='shape '+(mode==='shape'?item[0]:'circle');art.style.background=mode==='shape'?color[0]:item[0];const label=document.createElement('span');label.textContent='';label.setAttribute('aria-hidden','true');b.setAttribute('aria-label',item[1]);b.append(art,label);b.onclick=()=>answer(b,item[1]);choices.appendChild(b)});document.getElementById('stats').textContent=`⭐ Desafio ${step+1} de 20 · Acertos: ${score}`;msg.textContent='👂 Ouve e toca na imagem certa!';setTimeout(()=>{if(!locked)falarCrianca(document.getElementById('question').textContent.replace(/[👀🎨]/gu,''))},200)}function answer(btn,value){if(locked)return;if(value===question.correct){locked=true;score++;btn.classList.add('correct');msg.textContent='🎉 Muito bem! Acertaste!';beep(true);falarCrianca('Muito bem!');step++;setTimeout(next,1050)}else{btn.classList.add('wrong');btn.disabled=true;msg.textContent='😊 Tenta novamente!';beep(false);falarCrianca('Tenta outra vez!')}}function start(){step=0;score=0;next()}document.getElementById('hear').onclick=()=>falarCrianca(document.getElementById('question').textContent.replace(/[👀🎨]/gu,''));document.getElementById('new').onclick=start;document.getElementById('mode').onchange=start;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado'};start();</script></body></html>
